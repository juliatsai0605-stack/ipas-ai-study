name: Validate iPAS study website
on:
  pull_request:
  push:
    branches:
      - feature/aiya-free-anime-v1
jobs:
  smoke:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Import permanent Aiya reference asset
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/aiya-free-anime-v1'
        env:
          ART_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:199/quality:100/uri:ifs%3A%2F%2FM%2F3f4b1f8a-1e5f-474d-b3ff-6cf1951eba87/watermark:F/width:134?csig=AAAAAAAAAAAAAAAAAAAAAMyjqtAGS-YgkUD84twbYRE7mgOKSGyCIz2W5KLM24eG&exp=1792938773&osig=AAAAAAAAAAAAAAAAAAAAAEU08CYGS4wRSMQU_7ucRoCpz1Gz8qJq6ZyTpFwfYVpz&signer=media-rpc&token=AAIAAU0AJDNmNGIxZjhhLTFlNWYtNDc0ZC1iM2ZmLTZjZjE5NTFlYmE4NwAAAAABoXN6iggzfu7Lx-1cKkw-yksIDl6knxlU2VLTwi3MoJHMiFcFCQ&x-canva-quality=thumbnail'
        run: |
          if [ ! -s img/aiya-reference.png ]; then
            curl --fail --location --retry 3 --silent --show-error "$ART_URL" -o img/aiya-reference.png
            test "$(wc -c < img/aiya-reference.png)" -gt 10000
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add img/aiya-reference.png
            git commit -m "assets: import original Aiya art for website"
            git push origin HEAD:feature/aiya-free-anime-v1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check site, courses, bank and cloud schemas
        run: node tests/smoke.mjs
      - name: Set up browser tests
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Run browser tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ipas-http.log 2>&1 &
          sleep 2
          node tests/browser.mjs
      - name: Upload visual test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipas-browser-screenshots
          path: |
            test-*.png
            home-*.png
            lesson-*.png
          if-no-files-found: ignore

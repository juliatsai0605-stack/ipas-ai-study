name: Validate iPAS study website
on:
  pull_request:
  push:
    branches:
      - feature/aiya-free-anime-v1
concurrency:
  group: ipas-visual-asset-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check site, courses, bank and cloud schemas
        run: node tests/smoke.mjs
      - name: Set up browser tests
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Run browser tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ipas-http.log 2>&1 &
          sleep 2
          node tests/browser.mjs
          node tests/cloud.mjs
          node tests/exams.mjs
      - name: Upload visual test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipas-browser-screenshots
          path: |
            test-*.png
            home-*.png
            home-fold-*.png
            lesson-*.png
            cloud-*.png
            exam-*.png
            img/lab-scene.png
            img/lab-room.svg
            img/map-skyline.png
            img/aiya-reference.png
          if-no-files-found: ignore

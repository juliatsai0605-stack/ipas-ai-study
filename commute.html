<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通勤聊 AI｜男女聲輕快對談</title><style>body{max-width:950px;margin:25px auto;padding:0 18px;background:#f5f7fc;color:#263451;font:18px/1.8 system-ui}section,header{background:white;border:1px solid #dde1ee;border-radius:16px;padding:20px;margin:18px 0}audio{width:100%}button,select,input{font:inherit;margin:5px;padding:8px;border:1px solid #aab6cf;border-radius:8px}button{cursor:pointer;background:#f5f3ff;color:#283660}nav{max-height:360px;overflow:auto}nav button{display:block;width:95%;text-align:left}a{overflow-wrap:anywhere}.muted{font-size:15px;color:#526078}#script p{margin:1em 0}</style><header><h1>通勤聊 AI</h1><p>女聲導讀曉臻，與男聲學習者雲希，輕快聊生活和工作裡的疑問。50段原創對談，角色由AI聲音演繹；可選一段聽，也可開啟連播或下載。</p><p class="muted">文字稿就在音檔下方。這些是本站原創對談，不是第三方影片逐字稿；手機背景與鎖屏播放依裝置支援。</p><a href="./">返回備考室</a> · <a href="./" target="_blank" rel="noopener">進入學習網站做題</a><p><a href="commute-audio.zip" download>下載全部對談MP3與文字稿</a></p></header><section><h2 id="title"></h2><audio id="player" controls preload="metadata"></audio><div><button id="commuteStop">停止</button><button id="previous">上一節</button><button id="next">下一節</button><label>速度<select id="rate"><option value="0.9">0.9倍</option><option value="1" selected>1倍</option><option value="1.15">1.15倍</option></select></label><label><input id="auto" type="checkbox">自動接續下一節</label></div><p id="commuteStatus" role="status" class="muted">曉臻音檔已備妥。</p><a id="download" download>下載這一節MP3</a><p id="practice" class="muted"></p><h3>本段原創對談文字稿</h3><div id="script"></div></section><section><h2>選擇單元</h2><input id="find" type="search" placeholder="輸入代碼或主題" aria-label="搜尋單元"><nav id="list" aria-label="通勤單元"></nav></section><script>const lessons=[{"code": "L11101", "title": "AI 的定義與分類", "dialogue": [{"role": "學習者", "text": "我看到一個自動寄信的功能，廣告也說它是人工智慧。現在只要會自動跑，就算人工智慧嗎？"}, {"role": "導讀", "text": "不一定耶。假如只是設定星期一早上寄出，那可能就是固定規則。我比較想知道，它有沒有從資料裡學到東西。"}, {"role": "學習者", "text": "那垃圾郵件過濾呢？它好像會越用越懂我。"}, {"role": "導讀", "text": "如果它是從郵件範例學著分類，就是機器學習；機器學習又是人工智慧的一部分。深度學習則是其中用多層神經網路的一種方法。"}, {"role": "學習者", "text": "可是，幫我判斷垃圾信，跟幫我寫回信，我以前都叫它人工智慧。"}, {"role": "導讀", "text": "都可以這樣叫，只是任務不同。一個在判斷，一個在生成。寫好回信之後能不能直接寄出去，又是另一個問題：你願意給它多少權限。"}, {"role": "學習者", "text": "原來不是名字越新就越厲害，我得先問它到底在做哪件事。"}, {"role": "導讀", "text": "對。同一個信箱，就能同時看到分類、生成，還有人最後按下寄出。幾個概念放回這個畫面，就比較不會打結了。"}], "practiceCount": 6, "duration": 75.06, "file": "audio/podcast-mf/L11101.mp3", "bytes": 450956, "sha256": "1697aadd6f603531170988c02e746755caf814c801abae22391775a13d808bc6", "peakDb": -3.4, "decode": "pass"}, {"code": "L11102", "title": "AI 治理概念", "dialogue": [{"role": "學習者", "text": "如果一個模型準確率很高，我們是不是就可以放心用了？"}, {"role": "導讀", "text": "我會先問，它錯的那幾次，會發生什麼事。猜錯一張貓照片，跟把申請人的資格判錯，後果差很多。"}, {"role": "學習者", "text": "那如果我把準確率再拉高一點呢？"}, {"role": "導讀", "text": "當然有幫助，可是誰能申訴、誰負責覆核、用了什麼資料，這些問題不會自己消失。模型分數很漂亮，也可能讓某一群人一直吃虧。"}, {"role": "學習者", "text": "聽起來，治理其實不只是多加一個審查表。"}, {"role": "導讀", "text": "是把責任安排進整個流程。像同仁收到模型建議，得知道它依據什麼，也真的有時間和權限說不，而不是只能按確認。"}, {"role": "學習者", "text": "所以「有人看過」跟「有人能管得住」，還是不一樣。"}, {"role": "導讀", "text": "差在那個人能不能介入。把人工覆核變成蓋章儀式，名字叫有人監督，效果卻可能跟沒有差不多。"}], "practiceCount": 25, "duration": 61.5, "file": "audio/podcast-mf/L11102.mp3", "bytes": 369596, "sha256": "6911f597c9cdc9960e55ac931bb95d67a98839a7df2e9f1f3fdd33d0117bad4a", "peakDb": -4.4, "decode": "pass"}, {"code": "L11201", "title": "資料基本概念與來源", "dialogue": [{"role": "學習者", "text": "我手上有一大堆資料，是不是模型就比較容易做好？"}, {"role": "導讀", "text": "先別看有幾萬筆。假設你要預測下個月的需求，手上卻都是五年前另一個地區的資料，數量再多也不一定對得上。"}, {"role": "學習者", "text": "可是那些數字都是真的，這樣也不行？"}, {"role": "導讀", "text": "真的，跟適合這個問題，是兩件事。我會看它怎麼收來的、涵蓋哪些人、少了誰，還有每個欄位到底代表什麼。"}, {"role": "學習者", "text": "像有人沒填收入，我不能直接當成收入是零。"}, {"role": "導讀", "text": "對，那會把「不知道」變成一個假的事實。資料字典和來源紀錄看起來很樸素，常常比急著選模型更能救場。"}, {"role": "學習者", "text": "我懂了，資料像食材，不能只看冰箱塞得滿不滿。"}, {"role": "導讀", "text": "還要看今天要煮什麼、食材從哪裡來。這個比喻也提醒我們：公開找得到的資料，仍然要確認能怎麼使用。"}], "practiceCount": 9, "duration": 62.75, "file": "audio/podcast-mf/L11201.mp3", "bytes": 377084, "sha256": "ddddfcc6d873cdd9b436d5f4e6e1632827fc4d8e1039c9dc4164be85907514a4", "peakDb": -4.5, "decode": "pass"}, {"code": "L11202", "title": "資料整理與分析流程", "dialogue": [{"role": "學習者", "text": "一張表只是有幾格空白，我以前都先補零，至少程式不會報錯。"}, {"role": "導讀", "text": "程式很安靜，結果卻可能被你改掉。年齡沒填，不代表剛出生；金額沒填，也不代表沒花錢。"}, {"role": "學習者", "text": "那全部刪掉呢？感覺比較乾淨。"}, {"role": "導讀", "text": "也可能把某一群人刪光。所以得先弄清楚為什麼缺，再決定補值、保留標記，還是排除，沒有一招通吃。"}, {"role": "學習者", "text": "還有那種重複資料，看起來像同一個人，我就合併？"}, {"role": "導讀", "text": "得看資料的粒度。同一個人辦了三件事，本來就可能有三列。把事件表當成人員名冊處理，真實紀錄也會被你消掉。"}, {"role": "學習者", "text": "原來「清理」不是把看不順眼的地方都擦掉。"}, {"role": "導讀", "text": "比較像把事情問清楚：一列是誰、一欄是什麼、哪裡真的有錯。處理完再核對數量，才知道自己改了什麼。"}], "practiceCount": 31, "duration": 62.99, "file": "audio/podcast-mf/L11202.mp3", "bytes": 378524, "sha256": "c8a33343735136b290de27ae09e53686557aa4654f06bff90c512d0198496bec", "peakDb": -3.6, "decode": "pass"}, {"code": "L11203", "title": "資料隱私與安全", "dialogue": [{"role": "學習者", "text": "我把姓名拿掉，再把表格交給人工智慧分析，應該就匿名了吧？"}, {"role": "導讀", "text": "還不能這麼快放心。生日、地區、職業湊在一起，有時候仍然能猜到是誰，尤其是一小群人的資料。"}, {"role": "學習者", "text": "那把身分證號碼換成代碼，也一樣？"}, {"role": "導讀", "text": "如果代碼還能透過另一張表接回本人，那比較接近去識別或假名處理，不能直接宣稱已經無法辨識。"}, {"role": "學習者", "text": "所以我不是只問「有沒有名字」，還得想「能不能拼回去」。"}, {"role": "導讀", "text": "沒錯。也要問這次分析真的需要哪些欄位，誰能讀，保留多久。資料留得越少，出問題時通常也少一點暴露。"}, {"role": "學習者", "text": "這樣聽起來，先少拿幾欄，比事後想辦法遮住還實在。"}, {"role": "導讀", "text": "而且不只模型本身。上傳的工具、紀錄檔、下載出去的結果，都可能成為資料流出去的地方。"}], "practiceCount": 9, "duration": 60.97, "file": "audio/podcast-mf/L11203.mp3", "bytes": 366428, "sha256": "0114c0de6cf54f01fb2a54db9d0bbf31a1f82066e5e5bbd03d321424e82bc3b7", "peakDb": -3.3, "decode": "pass"}, {"code": "L11301", "title": "機器學習基本原理", "dialogue": [{"role": "學習者", "text": "模型會從資料學習，那是不是把資料丟進去，它就自己懂了？"}, {"role": "導讀", "text": "它會找規律，可是「你希望它學會什麼」，還是要安排。像你給照片和正確標籤，是監督式；只有照片想找群組，就是另一種做法。"}, {"role": "學習者", "text": "那強化學習，是不是也有正確答案可以抄？"}, {"role": "導讀", "text": "它比較像在環境裡試著行動，再根據回饋調整策略。回饋怎麼設，會很大程度影響它最後追求什麼。"}, {"role": "學習者", "text": "難怪遊戲分數設得奇怪，玩家就會想辦法鑽漏洞。"}, {"role": "導讀", "text": "模型也可能學到你沒打算獎勵的捷徑。所以訓練分數漂亮，不等於它在真實情境就做對事。"}, {"role": "學習者", "text": "那我怎麼知道它不是只把題目背起來？"}, {"role": "導讀", "text": "拿沒參與訓練的資料來看，而且那批資料要像未來真的會遇到的情況。這才比較接近「有沒有學會」，而不只是「記不記得」。"}], "practiceCount": 19, "duration": 63.56, "file": "audio/podcast-mf/L11301.mp3", "bytes": 381980, "sha256": "136b30dd7e661d97d51bbfb8e30efa054ee53553dd83ca2af9c868633f9b0b1d", "peakDb": -2.4, "decode": "pass"}, {"code": "L11302", "title": "常見的機器學習模型", "dialogue": [{"role": "學習者", "text": "有人跟我說，現在直接用最複雜的模型就好，不用看那些老方法了。"}, {"role": "導讀", "text": "如果你只是想估一個金額，線性模型也許已經很有用。模型越複雜，不代表每個問題都值得付出那個成本。"}, {"role": "學習者", "text": "那決策樹呢？我看它像一張一路問問題的流程圖。"}, {"role": "導讀", "text": "這個直覺很好。它依條件往下分，單棵容易看；組合很多棵之後，可能改善預測，但也不再像小樹那麼容易解釋。"}, {"role": "學習者", "text": "分群是不是也會把資料判成某一類？"}, {"role": "導讀", "text": "它會分組，可是通常不是照你事先給好的標籤。把相近的客群聚起來，跟判斷一位客人會不會流失，是不同任務。"}, {"role": "學習者", "text": "所以選模型之前，要先分清楚我要答案，還是要找結構。"}, {"role": "導讀", "text": "還有資料量、可解釋性和維護資源。工具箱裡不是只有一把最新的鎚子，然後每個問題都變成釘子。"}], "practiceCount": 52, "duration": 63.95, "file": "audio/podcast-mf/L11302.mp3", "bytes": 384284, "sha256": "9130e1f606f4ebe01cd36f7133a2cfd581d9da7b93008f74483462741463ce6d", "peakDb": -4.0, "decode": "pass"}, {"code": "L11401", "title": "鑑別式 AI 與生成式 AI 的基本原理", "dialogue": [{"role": "學習者", "text": "生成式人工智慧很會寫，那它是不是也很會判斷真假？"}, {"role": "導讀", "text": "流暢和正確不一定一起出現。它能接出很像樣的句子，不表示句子裡的人名、日期和引用都查過了。"}, {"role": "學習者", "text": "那鑑別式跟生成式，到底怎麼分比較不會亂？"}, {"role": "導讀", "text": "想成你收到一張圖片：判斷它是不是瑕疵品，是在做判斷；依照文字描述畫出一張新圖，則是在產生內容。"}, {"role": "學習者", "text": "可是聊天工具也能幫我分類郵件，它不是生成式模型嗎？"}, {"role": "導讀", "text": "可以啊。模型的原理和你交給它的任務，要分開看。生成式模型也能被拿來回答分類問題，不能只看介面像不像聊天。"}, {"role": "學習者", "text": "難怪有些題目一直換產品名字，我就被帶走了。"}, {"role": "導讀", "text": "把名字遮住，看看輸入是什麼、要輸出什麼，反而比較清楚。最後如果牽涉事實，來源還是要另外核對。"}], "practiceCount": 19, "duration": 64.07, "file": "audio/podcast-mf/L11401.mp3", "bytes": 385004, "sha256": "de32e20e7b4873d048266d1fd549c66830cd81f578e1b781536c1c5b9eb3b2cc", "peakDb": -3.0, "decode": "pass"}, {"code": "L11402", "title": "鑑別式 AI 與生成式 AI 的整合應用", "dialogue": [{"role": "學習者", "text": "如果生成式模型什麼都能回答，那還需要其他模型一起搭嗎？"}, {"role": "導讀", "text": "很常需要。像文件先用辨識工具轉成文字，再分類、找出相關段落，最後才請生成式模型整理成容易讀的回答。"}, {"role": "學習者", "text": "有點像分工，不是叫一個人從收件做到核章。"}, {"role": "導讀", "text": "對，而且每一段都能設檢查。譬如內容摘要得很順，也不能反過來證明前面的文字辨識沒有漏行。"}, {"role": "學習者", "text": "那每天更新的股價，乾脆每天拿去微調，會不會最直接？"}, {"role": "導讀", "text": "通常得考慮時效和維護成本。常變的資訊比較適合從受控資料來源取得；微調則可能用來調整輸出習慣或特定任務表現。"}, {"role": "學習者", "text": "所以把「怎麼講」和「今天知道什麼」拆開，會比較好設計。"}, {"role": "導讀", "text": "是啊。再補上資料更新時間、來源和輸出檢查，整個系統才不會只剩一段很好聽、卻過期的答案。"}], "practiceCount": 15, "duration": 65.08, "file": "audio/podcast-mf/L11402.mp3", "bytes": 391052, "sha256": "c61be0557065328e369119efcadc70f707583500e76aeacca75d91bcb97d3f51", "peakDb": -4.1, "decode": "pass"}, {"code": "L12101", "title": "No Code / Low Code 的基本概念", "dialogue": [{"role": "學習者", "text": "我看到有人拖幾個方塊，就做出一個流程。那是不是以後都不用寫程式了？"}, {"role": "導讀", "text": "某些事情真的可以省很多工。像表單收進來，分類後送通知，用圖形介面就能搭出來；遇到特別的邏輯，可能還是要補程式。"}, {"role": "學習者", "text": "所以無程式碼和低程式碼，並不是同一個程度。"}, {"role": "導讀", "text": "對，前者盡量讓你不寫程式；後者通常保留少量程式的擴充空間。不過產品名稱怎麼叫，還是要看它實際能做什麼。"}, {"role": "學習者", "text": "我最怕的是，畫面上看起來都接好了，結果資料悄悄跑錯地方。"}, {"role": "導讀", "text": "這也是為什麼拖拉不等於不用設計。欄位對應、錯誤重試、權限和資料出去的方向，一樣得看清楚。"}, {"role": "學習者", "text": "原來少寫幾行程式，不代表少想幾個問題。"}, {"role": "導讀", "text": "沒錯。工具把某些技術細節藏起來，是幫你省力；流程該由誰決定，還是得有人負責。"}], "practiceCount": 26, "duration": 65.99, "file": "audio/podcast-mf/L12101.mp3", "bytes": 396524, "sha256": "79cddf2efd8d16c7bff79d2c524447526302ae859de6beedfc37b8168ba07029", "peakDb": -3.5, "decode": "pass"}, {"code": "L12102", "title": "No Code / Low Code 的優勢與限制", "dialogue": [{"role": "學習者", "text": "低程式碼平台看起來很快，我是不是先買一套，之後有需求再慢慢加？"}, {"role": "導讀", "text": "我會先拿一個真的要用的流程試試看。畫面做得快，不代表日後的授權、資料搬遷和維護，也一樣輕鬆。"}, {"role": "學習者", "text": "你是在說，做得出來，跟搬得走，是兩件事？"}, {"role": "導讀", "text": "對。資料能不能匯出、接其他系統要不要加錢、流程越多會不會更難管，這些往往到後面才開始痛。"}, {"role": "學習者", "text": "可是自己寫程式，也不見得比較便宜啊。"}, {"role": "導讀", "text": "當然，所以不用把它變成二選一的信仰。有些標準流程交給平台，有些特殊邏輯自己做，反而能取得平衡。"}, {"role": "學習者", "text": "那我試用時，只看成功跑完一次，應該還不夠。"}, {"role": "導讀", "text": "可以故意讓它失敗看看。欄位漏填、連線斷掉、權限不夠的時候，系統怎麼交代，常比展示畫面更有參考價值。"}], "practiceCount": 3, "duration": 63.8, "file": "audio/podcast-mf/L12102.mp3", "bytes": 383420, "sha256": "b01ccc2bf2ab4fd73400d86df7c1529fa3fb4317573f82b44b7aeb65a52fe148", "peakDb": -4.4, "decode": "pass"}, {"code": "L12201", "title": "生成式 AI 應用領域與常見工具", "dialogue": [{"role": "學習者", "text": "現在生成式工具太多了，我看到整理表就想存，結果越存越不知道要用哪個。"}, {"role": "導讀", "text": "我也會先把工具名字拿掉，改問今天要完成什麼。找資料、改文章、做圖片、整理會議，對工具的要求其實不一樣。"}, {"role": "學習者", "text": "像我請一個很會畫圖的工具幫我查最新規定，可能一開始就選錯方向。"}, {"role": "導讀", "text": "即使它有聊天功能，也不保證能查到最新原文。能不能連到資料來源、能不能看出引用，跟會不會把話寫漂亮，要分開看。"}, {"role": "學習者", "text": "還有上傳檔案，大家都說很方便。"}, {"role": "導讀", "text": "方便沒錯，但要知道檔案送去哪裡、保存多久、哪些人能存取。尤其不能把「我有付費」理解成什麼資料都適合上傳。"}, {"role": "學習者", "text": "這樣我整理工具清單，就不用追著每個新名字跑了。"}, {"role": "導讀", "text": "把任務、資料條件、輸出品質和成本放在一起比，清單才會替你減少選擇，而不是再增加一層焦慮。"}], "practiceCount": 17, "duration": 67.4, "file": "audio/podcast-mf/L12201.mp3", "bytes": 405020, "sha256": "ad5c5925851c00aa124511a683bbaf982f9f73341e98d1293c60d1472ecf8c98", "peakDb": -4.5, "decode": "pass"}, {"code": "L12202", "title": "如何善用生成式 AI 工具", "dialogue": [{"role": "學習者", "text": "我以前下提示，都寫「你是最厲害的專家」。結果它還是會亂猜。"}, {"role": "導讀", "text": "那句話不一定幫得上忙。比起稱讚它，給清楚的任務、必要背景、限制和輸出格式，通常更有用。"}, {"role": "學習者", "text": "如果我貼三篇舊報告，叫它照那個風格寫呢？"}, {"role": "導讀", "text": "那是給示例，能幫它抓格式。但舊報告裡的數字不會因為格式很好，就自動變成本次的新事實。"}, {"role": "學習者", "text": "我還常看到檢索、代理、工具協定，被寫得像同一件事。"}, {"role": "導讀", "text": "其實分工不同。檢索是把相關來源找進來，工具介接讓它能連到外部能力，代理則可能規劃步驟並操作工具，不能把名稱全部混用。"}, {"role": "學習者", "text": "所以不是提示越長，它就越可靠。"}, {"role": "導讀", "text": "對，讓它有證據、有邊界，比堆一大段角色設定實在。真的要寄信或改資料時，還得決定哪些動作必須有人確認。"}], "practiceCount": 74, "duration": 65.32, "file": "audio/podcast-mf/L12202.mp3", "bytes": 392492, "sha256": "aaaa411eb40a27c23bf37890d8d4e4aebdd5e456291a77c9a6d65dabcead145e", "peakDb": -3.8, "decode": "pass"}, {"code": "L12301", "title": "生成式 AI 導入評估", "dialogue": [{"role": "學習者", "text": "主管問我要不要導入人工智慧，我直覺先去找哪個模型最強。"}, {"role": "導讀", "text": "我反而會先問，現在最困擾大家的是哪一段。如果根本沒弄清楚問題，再強的模型也可能只是替混亂加速。"}, {"role": "學習者", "text": "像同仁找不到表單，也不一定需要一個聊天機器人。"}, {"role": "導讀", "text": "可能把分類和搜尋做好就改善很多。導入前得比較原來的做法、簡單的替代方案，和人工智慧真的多帶來什麼。"}, {"role": "學習者", "text": "可是如果大家都說很好用，我拿這個當成效可以嗎？"}, {"role": "導讀", "text": "可以當使用感受的一部分，還要看時間有沒有省、錯誤有沒有少，以及新增的覆核工作有多少。不能只計算看起來省下的那一段。"}, {"role": "學習者", "text": "那有些案子，評估完決定不做，也算有價值？"}, {"role": "導讀", "text": "很有價值啊。你花小成本知道資料不夠、風險太高，總比上線之後才發現不適合，然後每個人都要幫它擦屁股好。"}], "practiceCount": 37, "duration": 65.72, "file": "audio/podcast-mf/L12301.mp3", "bytes": 394940, "sha256": "cddfdace3ee2c5d61d81ebb838415ea3254708cfbae6e1fd1744855e7616e771", "peakDb": -3.8, "decode": "pass"}, {"code": "L12302", "title": "生成式 AI 導入規劃", "dialogue": [{"role": "學習者", "text": "如果評估通過了，是不是就可以直接全機關一起用？"}, {"role": "導讀", "text": "我會先挑範圍小、結果容易核對的一段試辦。先知道它在哪裡幫得上忙、在哪裡會出錯，再談擴大。"}, {"role": "學習者", "text": "可是小規模試用很好，換到正式環境就出問題，這種事怎麼避免？"}, {"role": "導讀", "text": "試辦資料和流程要夠貼近現場。除了正常案例，還要放進漏資料、例外案件、有人不同意模型結果的情況。"}, {"role": "學習者", "text": "那驗收不能只說「回答看起來不錯」。"}, {"role": "導讀", "text": "可以事先講清楚哪些結果算可用，誰來檢查，失敗時怎麼接回人工。連同教育訓練、維護窗口和退場安排，一起設計。"}, {"role": "學習者", "text": "退場也要一開始就想？感覺有點掃興。"}, {"role": "導讀", "text": "其實是替大家留路。等到工具停用或供應商變動，資料和工作還能接得回來，這個計畫才不會只在展示那一天很成功。"}], "practiceCount": 23, "duration": 63.9, "file": "audio/podcast-mf/L12302.mp3", "bytes": 383996, "sha256": "cff846e9f329841ab032175f7a280d7135dc96315c75d90ea85804e95764f54d", "peakDb": -4.2, "decode": "pass"}, {"code": "L12303", "title": "生成式 AI 風險管理", "dialogue": [{"role": "學習者", "text": "我最擔心的是模型亂講，可是風險管理是不是就是多做幾次查證？"}, {"role": "導讀", "text": "查證很重要，但還有資料外洩、權限過大、偏誤和服務中斷。它說錯話是一種風險，做了不該做的事又是另一種。"}, {"role": "學習者", "text": "像它讀到一份文件，裡面叫它把資料寄出去，它真的可能照做？"}, {"role": "導讀", "text": "這就是為什麼外部文字不能直接升格成指令。工具能做哪些動作、能碰哪些資料，要靠系統權限限制，不只靠一句「請小心」。"}, {"role": "學習者", "text": "那上線之前測完，就可以把風險表收起來了嗎？"}, {"role": "導讀", "text": "現場資料、使用者和工具版本都會變。還得看錯誤紀錄、異常操作和申訴，必要時縮小用途，甚至暫停某個功能。"}, {"role": "學習者", "text": "原來風險不是一次打完勾，就會永遠不見。"}, {"role": "導讀", "text": "比較像一路看著儀表板開車。知道哪裡會出事，也得真的有煞車、替代路線和願意踩煞車的人。"}], "practiceCount": 16, "duration": 66.76, "file": "audio/podcast-mf/L12303.mp3", "bytes": 401132, "sha256": "acf78f1f7a0a22bb94a843999228304cd8642235a6dab3d7fa7b84e495ad7bc7", "peakDb": -4.0, "decode": "pass"}, {"code": "L21101", "title": "自然語言處理技術與應用", "dialogue": [{"role": "學習者", "text": "電腦看一句話，真的有在理解嗎？還是只是在算哪些字常一起出現？"}, {"role": "導讀", "text": "模型會把文字轉成可以運算的表示，再利用上下文找關係。它能做出有用的結果，但不能直接把人的理解經驗套到它身上。"}, {"role": "學習者", "text": "那向量是什麼？每次看到這個字，我腦中都只剩一串數字。"}, {"role": "導讀", "text": "可以先想成文字在某個表示空間裡的位置，讓系統比較哪些內容相關。不過位置接近，不等於兩句話的事實一定相同。"}, {"role": "學習者", "text": "所以兩份內容很像的文件，也可能一份是草案，一份已經生效。"}, {"role": "導讀", "text": "對。語意相似幫你找到候選，版本、日期和效力，還是得讀來源。檢索做得好，不代表後面的判斷可以省略。"}, {"role": "學習者", "text": "那斷詞、編碼這些前處理，現在還會影響結果嗎？"}, {"role": "導讀", "text": "會，只是不同模型處理方式不同。語言、領域用字、長度限制，都會影響它到底看到了哪些資訊。"}], "practiceCount": 17, "duration": 69.73, "file": "audio/podcast-mf/L21101.mp3", "bytes": 418988, "sha256": "667c6324b8dd22e9627766a5ca6c5b9ffcf7f4c0d51eecf984ff902a05f239ab", "peakDb": -3.4, "decode": "pass"}, {"code": "L21102", "title": "電腦視覺技術與應用", "dialogue": [{"role": "學習者", "text": "我看到視覺模型的展示，框框把人和車都圈出來，這就叫影像分類嗎？"}, {"role": "導讀", "text": "如果只回答這張圖是哪一類，比較像分類。把物件的位置圈出來，是偵測；細到每個像素屬於哪一區，又是分割。"}, {"role": "學習者", "text": "喔，原來都是看圖片，輸出也能差那麼多。"}, {"role": "導讀", "text": "所以得先看任務需要什麼。你只是要知道有沒有瑕疵，跟要指出瑕疵在哪一小塊，資料標註的成本就可能不同。"}, {"role": "學習者", "text": "展示影片很亮很清楚，現場卻可能下雨、逆光。"}, {"role": "導讀", "text": "這就是常見落差。訓練和測試如果只有漂亮照片，到了真實場域，角度、遮擋和光線都可能讓表現掉下來。"}, {"role": "學習者", "text": "那我不能只拿展示畫面問「準不準」。"}, {"role": "導讀", "text": "可以改問「在哪些條件下準」。把場景和失敗條件講清楚，往往比追一個總分，更接近現場需要的答案。"}], "practiceCount": 20, "duration": 64.38, "file": "audio/podcast-mf/L21102.mp3", "bytes": 386876, "sha256": "2502fe4034f31fab7ebbfbc78032a42a81474bc2664b3bf8f464800b948f568f", "peakDb": -2.5, "decode": "pass"}, {"code": "L21103", "title": "生成式 AI 技術與應用", "dialogue": [{"role": "學習者", "text": "生成式模型每次接著寫下去，怎麼能變成一段這麼完整的回答？"}, {"role": "導讀", "text": "它利用訓練中學到的模式，根據上下文預測後續內容。規模和訓練讓這件事很有用，可是這個過程本身不是逐句查資料。"}, {"role": "學習者", "text": "所以我把溫度調低，它就不會胡說了？"}, {"role": "導讀", "text": "溫度主要影響選擇的隨機程度。調低可能讓回答比較穩定，卻不等於內容已經通過事實查核。"}, {"role": "學習者", "text": "那我接上資料檢索，它總該比較放心了吧？"}, {"role": "導讀", "text": "通常更有依據，但還要看找進來的是不是正確版本，有沒有漏掉關鍵段落，模型又有沒有忠實使用那些內容。"}, {"role": "學習者", "text": "聽起來，每一層都可能讓答案看起來很合理，卻在細節走偏。"}, {"role": "導讀", "text": "所以我喜歡把回答和證據一起看。它怎麼說是一部分，憑什麼這樣說，才是下一個值得追問的地方。"}], "practiceCount": 11, "duration": 62.63, "file": "audio/podcast-mf/L21103.mp3", "bytes": 376364, "sha256": "5f5ee4853a40723968cf0fc4b12a9e545e50866187b5e76bda417879347c1896", "peakDb": -2.8, "decode": "pass"}, {"code": "L21104", "title": "多模態人工智慧應用", "dialogue": [{"role": "學習者", "text": "我傳一張圖給模型，再問它圖裡發生什麼事，這就是多模態？"}, {"role": "導讀", "text": "對，因為它同時處理圖像和文字。也可能把聲音、影片或其他訊號一起放進來，但不能只因為檔案種類多，就假設它全部看懂了。"}, {"role": "學習者", "text": "影片裡有人講了一句話，畫面卻是另一件事，會怎麼辦？"}, {"role": "導讀", "text": "時間對齊就很重要。哪一段聲音配哪幾格畫面，字幕有沒有延遲，這些都可能影響它最後拼出的意思。"}, {"role": "學習者", "text": "如果字幕錯了，可是畫面很清楚，兩個訊號是不是會互相補救？"}, {"role": "導讀", "text": "有機會，也可能一起把模型帶偏。多一種資料不保證自動變好，還是要看品質，以及系統怎麼整合。"}, {"role": "學習者", "text": "所以我問它「你剛剛根據哪個畫面」，不是故意刁難。"}, {"role": "導讀", "text": "反而很有用。讓它指出所依據的片段，再由人核對，比只收下一段很完整的敘述，更容易發現誤會從哪裡開始。"}], "practiceCount": 3, "duration": 66.61, "file": "audio/podcast-mf/L21104.mp3", "bytes": 400268, "sha256": "b6815e25678e47ffc0275a0b44e1c3346e8b952506b1f19d96bd6d8acde44f3f", "peakDb": -4.1, "decode": "pass"}, {"code": "L21201", "title": "AI 導入評估", "dialogue": [{"role": "學習者", "text": "同樣是導入人工智慧，為什麼有的案子很快見效，有的做很久還在試？"}, {"role": "導讀", "text": "有時候不是模型差，而是問題、資料和現場流程沒有接起來。像你想預測需求，卻連過去的需求怎麼記錄都不一致。"}, {"role": "學習者", "text": "那我應該先把資料全部整理完，再開始嗎？"}, {"role": "導讀", "text": "不用一口氣整理全世界。先圈出要改善的決策，看看最關鍵的資料拿不拿得到，做一個能比較成效的小驗證。"}, {"role": "學習者", "text": "比較成效，是跟另一個模型比嗎？"}, {"role": "導讀", "text": "也得跟現在的人工方法，或簡單規則比。要是很複雜的系統只多好一點點，維護和風險卻增加很多，就值得再想想。"}, {"role": "學習者", "text": "所以「值得做」不是只有技術可不可行。"}, {"role": "導讀", "text": "還有成本、可接受的錯誤，以及成果能不能真的進到工作裡。模型很會預測，現場卻沒人用那個結果，價值也不會自己出現。"}], "practiceCount": 2, "duration": 65.77, "file": "audio/podcast-mf/L21201.mp3", "bytes": 395228, "sha256": "beef687f6b2f1c5be3351a2ad824af06377501ed8149303fb7e1c43c66f6a226", "peakDb": -3.1, "decode": "pass"}, {"code": "L21202", "title": "AI 導入規劃", "dialogue": [{"role": "學習者", "text": "假設模型在試驗裡表現很好，接下來就是交給資訊人員上線了？"}, {"role": "導讀", "text": "交接的東西得比模型檔案多一些。誰提供資料、誰處理例外、版本怎麼換、結果怎麼驗收，都得接得起來。"}, {"role": "學習者", "text": "我以前以為，驗收只要跑一批測試資料。"}, {"role": "導讀", "text": "那能看出一部分。實際流程還有權限、回應時間、故障、誤用和人員訓練，不能全交給一張準確率表。"}, {"role": "學習者", "text": "如果新版本比較好，要不要直接把舊版換掉？"}, {"role": "導讀", "text": "可以先在受控範圍比較，保留回復方式。否則一上線就出現沒看過的錯誤，大家可能連退回哪個版本都不知道。"}, {"role": "學習者", "text": "聽起來，導入比較像安排一支團隊，不是買一個聰明零件。"}, {"role": "導讀", "text": "而且團隊要有人接班。供應商、承辦人或模型版本變動時，留下資料和決策紀錄，才不會每次都從頭猜。"}], "practiceCount": 2, "duration": 63.49, "file": "audio/podcast-mf/L21202.mp3", "bytes": 381548, "sha256": "e57f0342af95dda5ff36a216b658be1dc31129707c6c0f47af281ba3181bd5dd", "peakDb": -2.9, "decode": "pass"}, {"code": "L21203", "title": "AI 風險管理", "dialogue": [{"role": "學習者", "text": "大家說模型有風險，我第一個想到的是準確率不夠。還有什麼容易漏？"}, {"role": "導讀", "text": "可以想想，它用的是誰的資料、結果影響誰、能操作到哪裡。相同模型拿來寫活動文案，和拿來篩選資格，風險不會一樣。"}, {"role": "學習者", "text": "那風險分級，是不是找到一張表套進去就好了？"}, {"role": "導讀", "text": "表格能協助整理，但用途和後果還是得自己說明。尤其國外制度、技術框架和臺灣法律，不能直接畫上等號。"}, {"role": "學習者", "text": "如果資料來源換了一批，可是模型沒更新，也算風險嗎？"}, {"role": "導讀", "text": "算。資料分布、實際需求，甚至大家使用工具的方式，都會讓原來的評估慢慢失去代表性。"}, {"role": "學習者", "text": "所以監控不只是看伺服器有沒有活著。"}, {"role": "導讀", "text": "也要看它有沒有持續做對事，出錯時誰看得見、能不能暫停。風險表如果永遠寫「持續注意」，卻沒有動作，就很難真的保護現場。"}], "practiceCount": 3, "duration": 67.26, "file": "audio/podcast-mf/L21203.mp3", "bytes": 404156, "sha256": "06bd96473c2fbb59ffc890ad7c5d103b352b05180069fe1b728ba7e98b4a77bb", "peakDb": -3.5, "decode": "pass"}, {"code": "L21301", "title": "數據準備與模型選擇", "dialogue": [{"role": "學習者", "text": "我已經想好要用某個模型了，接著找資料配合它，可以嗎？"}, {"role": "導讀", "text": "可以試，但要小心變成拿工具決定問題。先看標籤怎麼來、資料夠不夠、未來使用時拿不拿得到這些欄位，會比較踏實。"}, {"role": "學習者", "text": "未來拿不到的欄位，現在不能拿來訓練？"}, {"role": "導讀", "text": "如果它只在結果發生後才出現，放進模型就可能洩漏答案。測試分數很高，上線時卻根本無法提供那個資訊。"}, {"role": "學習者", "text": "像我要預測是否逾期，卻把結案後才填的註記當輸入。"}, {"role": "導讀", "text": "就是這種感覺。還有補值、標準化等步驟，也得避免先偷看測試資料，再回頭說模型學得很好。"}, {"role": "學習者", "text": "那我比較模型時，得讓它們站在同一條起跑線。"}, {"role": "導讀", "text": "同樣的資料切分、適合任務的指標，以及真實可取得的輸入。這樣比出來的差異，才比較像模型能力，而不是誰先看了答案。"}], "practiceCount": 7, "duration": 64.16, "file": "audio/podcast-mf/L21301.mp3", "bytes": 385580, "sha256": "ead2a9f4713d794b8599f0eccb720646a0c10192212b84fe9a46df93e7722ccb", "peakDb": -2.1, "decode": "pass"}, {"code": "L21302", "title": "AI 技術系統集成與部署", "dialogue": [{"role": "學習者", "text": "模型寫完之後，包成一個服務，不就能串到系統裡了？"}, {"role": "導讀", "text": "能回傳結果是第一步。現場還會問：等多久、一次來多少請求、資料格式變了怎麼辦，以及服務掛掉時誰來接。"}, {"role": "學習者", "text": "那如果模型本身都沒錯，串接也可能出事？"}, {"role": "導讀", "text": "當然。像日期格式、編碼或欄位單位不一致，都可能讓正確模型吃到錯誤輸入，最後回一個很有自信的答案。"}, {"role": "學習者", "text": "我想像的是，每次更新都把檔案覆蓋掉。"}, {"role": "導讀", "text": "最好能辨認當時用了哪個模型和前處理版本，也留得下監控和回復方式。否則出問題時，很難重現那次結果。"}, {"role": "學習者", "text": "所以部署不是最後按一次上傳，然後就結束了。"}, {"role": "導讀", "text": "比較像開店。模型是招牌菜，供料、出餐速度、客訴和停電時怎麼辦，也都影響這家店能不能真的營運。"}], "practiceCount": 22, "duration": 62.77, "file": "audio/podcast-mf/L21302.mp3", "bytes": 377228, "sha256": "bee3fe6a1cc43a39341ef7ce7c710c781cc4ed4a749b458a41f73a3f4af53c21", "peakDb": -4.2, "decode": "pass"}, {"code": "L22101", "title": "敘述性統計與資料摘要技術", "dialogue": [{"role": "學習者", "text": "有一群人的收入，平均看起來很高，可是大部分人都說沒感覺，是數字算錯了嗎？"}, {"role": "導讀", "text": "不一定。少數特別高的數值，就可能把平均往上拉。這時候看看中位數和分布，通常比只盯一個平均更有畫面。"}, {"role": "學習者", "text": "那以後都用中位數，會不會比較保險？"}, {"role": "導讀", "text": "也不用換成另一種固定答案。你想知道典型情況、總量如何分攤，還是差異有多大，適合看的摘要就不同。"}, {"role": "學習者", "text": "差異有多大，就是看標準差？"}, {"role": "導讀", "text": "可以用它描述離散程度，也可以看四分位距等方式。遇到偏斜或極端值時，要知道哪個摘要比較容易被拉動。"}, {"role": "學習者", "text": "原來摘要不是把很多數字縮成一個數字就算完成。"}, {"role": "導讀", "text": "是把重要樣子留下來。像每個地區都改善，整體卻看起來沒改善，可能還得回頭看看各組人數和組成是不是變了。"}], "practiceCount": 10, "duration": 64.52, "file": "audio/podcast-mf/L22101.mp3", "bytes": 387740, "sha256": "f74964c099617c6743083b66fb794487a6aa83937aeb7d1fb02c1071e67a0f0f", "peakDb": -4.4, "decode": "pass"}, {"code": "L22102", "title": "機率分佈與資料分佈模型", "dialogue": [{"role": "學習者", "text": "有人說這組資料看起來像常態分布，我就可以套常態的方法了嗎？"}, {"role": "導讀", "text": "「看起來像」可以當線索，還得看資料代表什麼、樣本量和分析方法的條件。不是每張鐘形圖都能當通行證。"}, {"role": "學習者", "text": "那機率分布是不是有很多名字要背？"}, {"role": "導讀", "text": "名字背後其實有情境。固定次數裡成功幾次，跟一段時間發生幾次事件，問題不同，可能用到的分布也不同。"}, {"role": "學習者", "text": "像十次嘗試成功幾次，和一天進來幾通電話，就不一樣。"}, {"role": "導讀", "text": "對，而且還有各次是否獨立、機率是否穩定等假設。資料不符合時，不能只因為故事有點像，就硬套。"}, {"role": "學習者", "text": "我還常把資料的分布，和抽樣平均的分布混在一起。"}, {"role": "導讀", "text": "這兩個真的值得分開想。原始資料可以很偏，抽樣統計量會怎麼變，則還要看抽樣方式和條件。"}], "practiceCount": 7, "duration": 62.36, "file": "audio/podcast-mf/L22102.mp3", "bytes": 374780, "sha256": "73522cf287f9cc2478155308cd3a6732f05ea35b89212b13c822e537e10a597e", "peakDb": -3.8, "decode": "pass"}, {"code": "L22103", "title": "假設檢定與統計推論", "dialogue": [{"role": "學習者", "text": "我看到報表寫「有統計顯著差異」，直覺就覺得這個方案很值得做。"}, {"role": "導讀", "text": "我會再看差了多少。樣本很大時，很小的差異也可能顯著；但那一點差距，對現場不一定有意義。"}, {"role": "學習者", "text": "所以小於零點零五，不是「成功的機率超過百分之九十五」？"}, {"role": "導讀", "text": "不是。p值是在虛無假說和模型假設下，觀察到這麼極端或更極端資料的機率，不能直接翻成假說為真的機率。"}, {"role": "學習者", "text": "那沒有顯著，是不是就證明兩邊沒差？"}, {"role": "導讀", "text": "也不能這樣跳。樣本太少、變異太大，都可能讓你看不清楚。還得搭配效果量、區間和研究設計。"}, {"role": "學習者", "text": "難怪同一批人前後測，不能隨便當成兩群完全不同的人。"}, {"role": "導讀", "text": "對，資料怎麼來，會影響檢定怎麼選。先弄懂誰跟誰配在一起，再看那個小數字，解讀才不容易走偏。"}], "practiceCount": 10, "duration": 64.81, "file": "audio/podcast-mf/L22103.mp3", "bytes": 389468, "sha256": "277729b2c0a27a461df20f7168246b4f265fb079c97a2ce5ae70124cb3a6b0bd", "peakDb": -3.8, "decode": "pass"}, {"code": "L22201", "title": "數據收集與清理", "dialogue": [{"role": "學習者", "text": "我把不同來源的表格合起來，列數變多，看起來資料更豐富，這樣可以直接分析嗎？"}, {"role": "導讀", "text": "先看合併的鍵是不是唯一。兩邊同一個代碼各有多筆，接起來可能變成成倍的組合，數量突然變多不一定是好消息。"}, {"role": "學習者", "text": "對耶，我以前還以為多出來的都是新資料。"}, {"role": "導讀", "text": "也可能是重複配對。還有日期、單位、缺值寫法和編碼，兩個單位看起來同名的欄位，意思未必完全相同。"}, {"role": "學習者", "text": "那把格式都改成一樣，應該就好了？"}, {"role": "導讀", "text": "格式一致只是第一層。像一邊記的是申請日期，另一邊記核定日期，就算都長得像年月日，也不能當成同一件事。"}, {"role": "學習者", "text": "所以我要留一份來源和轉換過程，不只是最後那張漂亮的表。"}, {"role": "導讀", "text": "沒錯。回頭能追到哪一筆從哪裡來、做過哪些處理，之後發現數字有問題，才不會只能重新從頭翻。"}], "practiceCount": 9, "duration": 65.89, "file": "audio/podcast-mf/L22201.mp3", "bytes": 395948, "sha256": "63c76c07ed468a5bc88caf0c401446c5fe2dc3d2e4ad61bce7a66b548da0edc0", "peakDb": -2.7, "decode": "pass"}, {"code": "L22202", "title": "數據儲存與管理", "dialogue": [{"role": "學習者", "text": "資料庫、資料倉儲、資料湖，聽起來都是放資料的地方，為什麼要分那麼細？"}, {"role": "導讀", "text": "因為要做的工作不同。每天接交易、讓多人同時更新，跟把歷史資料整理好做分析，對系統的要求不太一樣。"}, {"role": "學習者", "text": "資料湖是不是比較自由，檔案丟進去就好了？"}, {"role": "導讀", "text": "它可以保留不同形式的原始資料，但自由不代表不用管理。沒有目錄、品質和權限，最後可能變成誰也找不到東西的倉庫。"}, {"role": "學習者", "text": "那我看到NoSQL，是不是就不用結構，也不用設計查詢？"}, {"role": "導讀", "text": "還是得看資料模型和存取需求。文件、鍵值或圖形等做法，各有合適情境，不能只用「不是關聯式」就當成相同產品。"}, {"role": "學習者", "text": "所以選儲存方式，其實是在猜以後會怎麼使用。"}, {"role": "導讀", "text": "最好不是猜，而是先列出常見查詢、更新方式、規模和一致性需求。問清楚之後，系統名字才有比較的意義。"}], "practiceCount": 8, "duration": 69.64, "file": "audio/podcast-mf/L22202.mp3", "bytes": 418412, "sha256": "36ee7599d80e558c9a4c71b429187a2838c7c2548acb563a6afb47e81a3f98ae", "peakDb": -4.3, "decode": "pass"}, {"code": "L22203", "title": "數據處理技術與工具", "dialogue": [{"role": "學習者", "text": "資料太大，一台電腦算不完，我把工作拆到很多台，是不是就會快很多？"}, {"role": "導讀", "text": "有機會，但拆分、傳輸和重新組合也要時間。不是每個小工作，丟進分散式系統都會划算。"}, {"role": "學習者", "text": "那批次處理跟串流處理，是不是只差一個比較快？"}, {"role": "導讀", "text": "更像不同的工作節奏。批次整理一段時間的資料，串流則持續處理新事件；對延遲、重複事件和故障恢復的要求也不同。"}, {"role": "學習者", "text": "如果同一筆事件重送兩次，我的統計不就多算了？"}, {"role": "導讀", "text": "所以要考慮事件識別、去重和處理語意，不能只看資料有沒有進來。錯得很即時，也不會比較有用。"}, {"role": "學習者", "text": "原來效能之外，還要想結果能不能重現。"}, {"role": "導讀", "text": "像處理邏輯、輸入版本和工作紀錄都留得住，出了問題才有辦法追。大數據不只是在比誰的機器多。"}], "practiceCount": 4, "duration": 63.68, "file": "audio/podcast-mf/L22203.mp3", "bytes": 382700, "sha256": "03c47761f67383480a5d5bb173e6c08bcc4c5646295bcd852f7a549c1d314578", "peakDb": -3.7, "decode": "pass"}, {"code": "L22301", "title": "統計學在大數據中的應用", "dialogue": [{"role": "學習者", "text": "資料量這麼大，是不是以前那些統計上的麻煩，就可以不用管了？"}, {"role": "導讀", "text": "資料多能幫上一些忙，但收樣的方式如果偏了，可能只是把偏差估得更精細，不會因為筆數多就自己變公平。"}, {"role": "學習者", "text": "像只看願意上網填問卷的人，不能直接當成所有人的想法。"}, {"role": "導讀", "text": "對。還有很多變數一起找關聯，找久了，偶然看起來有趣的結果也會變多。得留意多重比較，別把每個小發現都當成重大線索。"}, {"role": "學習者", "text": "我本來以為，只要p值夠小，就不用煩惱是不是碰巧。"}, {"role": "導讀", "text": "在什麼條件、做了多少次比較，都會影響解讀。大資料很容易讓微小差異顯著，所以效果大小和實際意義反而更值得看。"}, {"role": "學習者", "text": "那大數據不是把統計淘汰，而是讓我更不能亂解讀。"}, {"role": "導讀", "text": "有點像手上的放大鏡變強了。你看得更細，但如果一開始就看錯地方，放大鏡也不會替你選對問題。"}], "practiceCount": 6, "duration": 67.26, "file": "audio/podcast-mf/L22301.mp3", "bytes": 404156, "sha256": "0e9fa2c1f166a013cdce74de4c37f04e5d89fa2734d6d3b097de0e506b1f14d0", "peakDb": -4.5, "decode": "pass"}, {"code": "L22302", "title": "常見的大數據分析方法", "dialogue": [{"role": "學習者", "text": "我把兩件事畫在一起，發現走勢很像，是不是就找到原因了？"}, {"role": "導讀", "text": "先別急著慶祝。它們可能互相影響，也可能同時受到第三個因素影響，光是一起變動，還不能直接說誰造成誰。"}, {"role": "學習者", "text": "像冰品賣得多，戶外活動也多，可能都是天氣熱。"}, {"role": "導讀", "text": "對。相關、分群、關聯規則、預測，各自在回答不同問題。挑出一個有趣模式之後，還得想它能不能穩定重現，有沒有別的解釋。"}, {"role": "學習者", "text": "關聯規則裡那種「買了甲也常買乙」，是不是代表推薦乙就一定有效？"}, {"role": "導讀", "text": "它先告訴你資料裡常一起出現，不是保證你介入後就會改變行為。推薦效果還是得透過合適的比較來看。"}, {"role": "學習者", "text": "所以分析可以幫我提出好問題，但不能自動把每個模式升格成結論。"}, {"role": "導讀", "text": "而且要留一批沒參與找模式的資料驗證。不然一路找、一路改，最後很可能只是找到這批資料最討喜的故事。"}], "practiceCount": 18, "duration": 69.78, "file": "audio/podcast-mf/L22302.mp3", "bytes": 419276, "sha256": "59e8a462ba1a20f4980f0fecfadb55bc5b6cb4bbee589a2ac916ad3bdc128bb2", "peakDb": -3.5, "decode": "pass"}, {"code": "L22303", "title": "數據可視化工具", "dialogue": [{"role": "學習者", "text": "同一份數字，換一張圖看起來就差很多。我到底該相信哪一張？"}, {"role": "導讀", "text": "先看它省略了什麼。軸從哪裡開始、時間範圍怎麼選、資料有沒有分組，都可能改變你第一眼的感受。"}, {"role": "學習者", "text": "柱狀圖把縱軸截掉，差一點點就會看起來差很大。"}, {"role": "導讀", "text": "是啊。還有只看總數，可能只是人口規模不同；改看比率，又得確認分母一致，不能一種圖走到哪裡都用。"}, {"role": "學習者", "text": "那很多欄位，我直接放一個能旋轉的三維圖，會不會比較厲害？"}, {"role": "導讀", "text": "如果大家看不出來要比較什麼，可能反而更累。顏色、位置和尺度最好都在幫人讀懂關係，而不是展示功能。"}, {"role": "學習者", "text": "聽起來，漂亮可以加分，但不能替代資料交代。"}, {"role": "導讀", "text": "我會希望圖旁邊還看得到定義、期間和來源。這樣別人問「這個數字是怎麼來的」，你不用只剩一句「圖表就是這樣畫」。"}], "practiceCount": 8, "duration": 65.87, "file": "audio/podcast-mf/L22303.mp3", "bytes": 395804, "sha256": "48bee4d0b9d41d8e3aa3a5b1ddb06a5d4070f7199b4c92de6c48210376342560", "peakDb": -3.6, "decode": "pass"}, {"code": "L22401", "title": "大數據與機器學習", "dialogue": [{"role": "學習者", "text": "我已經把資料集中到很大的平台，是不是很適合直接開始訓練模型？"}, {"role": "導讀", "text": "規模是條件之一，不是自動入場券。欄位意義、標籤品質和實際問題沒釐清，集中起來也可能只是把困惑放大。"}, {"role": "學習者", "text": "那資料多，至少比較不容易過度擬合吧？"}, {"role": "導讀", "text": "通常有機會改善，但要看是不是有用、獨立而且有代表性的資訊。一堆重複紀錄，不等於一堆新經驗。"}, {"role": "學習者", "text": "如果資料每天都會來，是不是每天都重訓比較好？"}, {"role": "導讀", "text": "也要比較成本和變化速度。有時候先監控資料與模型表現，發現需要才更新，比固定頻繁重訓更有理由。"}, {"role": "學習者", "text": "所以要一起規劃的，不只是那一次怎麼算完。"}, {"role": "導讀", "text": "還有資料怎麼進來、特徵怎麼算、版本怎麼留，以及模型後續怎麼被使用。把這些接起來，大數據才真的有機會變成能力。"}], "practiceCount": 1, "duration": 63.73, "file": "audio/podcast-mf/L22401.mp3", "bytes": 382988, "sha256": "158a2e111f3384aad87d1e7a9d93e8cbf5dd8eb57ac6ad51e32e8af96b8d4f8d", "peakDb": -4.6, "decode": "pass"}, {"code": "L22402", "title": "大數據在鑑別式 AI 中的應用", "dialogue": [{"role": "學習者", "text": "我想從很多紀錄裡找出高風險案件，只要把準確率做高就好了嗎？"}, {"role": "導讀", "text": "如果真正高風險的案例很少，全部猜低風險，準確率也可能很好看。所以得先談漏掉一件、和多查一件，各有什麼代價。"}, {"role": "學習者", "text": "那我把判定門檻調低，就能少漏一點？"}, {"role": "導讀", "text": "通常會找出更多可能案例，也可能增加誤報。門檻不是只有數學上的選擇，還牽涉後續有多少人力能覆核。"}, {"role": "學習者", "text": "原來模型多標出來，不代表現場就接得住。"}, {"role": "導讀", "text": "如果系統一天丟出幾千筆，卻沒人能看，數字再漂亮也未必能改善結果。資料、指標、門檻和處理流程得一起考慮。"}, {"role": "學習者", "text": "而且不能把模型的分數，直接當成事情已經被證明。"}, {"role": "導讀", "text": "對，它是協助判斷的訊號。知道資料限制和錯誤情況，才能讓後續的人有空間核對，而不是被一個分數推著走。"}], "practiceCount": 8, "duration": 65.29, "file": "audio/podcast-mf/L22402.mp3", "bytes": 392348, "sha256": "742fcee98f5286e33f17934d868eac552234760e95772ad89052b4fb1164c0ed", "peakDb": -2.3, "decode": "pass"}, {"code": "L22403", "title": "大數據在生成式 AI 中的應用", "dialogue": [{"role": "學習者", "text": "公司文件那麼多，我是不是把全部內容塞給模型，它就什麼都答得出來？"}, {"role": "導讀", "text": "它能一次讀多少，有長度和成本限制；而且內容多不代表找得到關鍵。相互矛盾或過期的文件，還可能把它弄混。"}, {"role": "學習者", "text": "所以才要先檢索，再把相關段落交給它？"}, {"role": "導讀", "text": "對，但檢索前也有工作。文件怎麼切、版本怎麼標、哪些人能讀，這些都會影響最後找進來的是什麼。"}, {"role": "學習者", "text": "如果舊規定寫得很清楚，新規定只有短短一行，它會不會反而找到舊的？"}, {"role": "導讀", "text": "有可能。所以不能只比文字相似，也得看日期、效力和適用範圍。引用一段很相關的舊文，仍然可能答錯今天的問題。"}, {"role": "學習者", "text": "那資料整理，其實也在幫生成式模型減少說錯話的機會。"}, {"role": "導讀", "text": "是幫它建立更好的依據。但模型有沒有忠實引用、能不能承認找不到，還是得另外檢查，不能因為接了檢索就當成保證。"}], "practiceCount": 1, "duration": 70.09, "file": "audio/podcast-mf/L22403.mp3", "bytes": 421148, "sha256": "5aaba328b1d30882df5f4deea497b8ed745b86c9aa9c7dabda553195365969b4", "peakDb": -3.9, "decode": "pass"}, {"code": "L22404", "title": "大數據隱私保護、安全與合規", "dialogue": [{"role": "學習者", "text": "資料放進很安全的平台，是不是隱私問題就算解決了？"}, {"role": "導讀", "text": "平台安全很重要，可是有人本來就不該看到某些欄位，登入後卻看得到，問題還是在。安全、隱私和合規有交集，不是同一件事。"}, {"role": "學習者", "text": "像加密能保護傳輸，卻不能替我決定這次收集是否合法。"}, {"role": "導讀", "text": "對。也要看目的、必要性、保存和存取範圍。不能把所有要求，都塞給一個叫做「加密」的按鈕。"}, {"role": "學習者", "text": "那差分隱私，是不是把個資刪掉的另一個名字？"}, {"role": "導讀", "text": "它關心的是某一個人參與資料與否，對輸出分布的影響受到多大限制。通常得在保護程度和分析效用之間作安排，不是讓輸出完全不變。"}, {"role": "學習者", "text": "原來每種保護手段，都有自己在處理的問題。"}, {"role": "導讀", "text": "所以比較好的問法是：我們怕誰看到什麼、透過哪條路、造成什麼影響。問題講清楚，才知道需要哪些保護一起合作。"}], "practiceCount": 5, "duration": 68.6, "file": "audio/podcast-mf/L22404.mp3", "bytes": 412220, "sha256": "a16d4bff73b5f6ecc09b770b2d4e5776edf8531896bd79d787efd81b8040260a", "peakDb": -3.8, "decode": "pass"}, {"code": "L23101", "title": "機率／統計之機器學習基礎應用", "dialogue": [{"role": "學習者", "text": "機器學習課一開始又是機率和統計，我還以為終於可以不用碰那些了。"}, {"role": "導讀", "text": "模型常常就在處理不確定性。它給某一類一個分數，或從樣本估計規律，背後都離不開這些概念。"}, {"role": "學習者", "text": "那它說有百分之八十機率，我就把它當成八成把握，可以嗎？"}, {"role": "導讀", "text": "還要看這個數字怎麼來，以及有沒有校準。很多次預測都說八成時，實際結果是不是大約八成，這才是值得檢查的事。"}, {"role": "學習者", "text": "所以一個分數排得很準，也不一定適合直接當成機率解讀。"}, {"role": "導讀", "text": "對。還有先驗、似然和後驗，它們在不同位置扮演角色。資料提供了多少證據，跟一開始的看法，都可能影響最後的判斷。"}, {"role": "學習者", "text": "聽起來，統計不是公式背完就可以丟掉的前置作業。"}, {"role": "導讀", "text": "它會一路跟著你看模型輸出。尤其碰到很少見的事件，基礎發生率一變，直覺就特別容易被漂亮的百分比騙過。"}], "practiceCount": 8, "duration": 68.1, "file": "audio/podcast-mf/L23101.mp3", "bytes": 409196, "sha256": "43a73b3d788751edab81c4f9b625bdeaa27a574d5fa1a70343df44293f3ab764", "peakDb": -4.4, "decode": "pass"}, {"code": "L23102", "title": "線性代數之機器學習基礎應用", "dialogue": [{"role": "學習者", "text": "我看到模型裡一大堆矩陣，常常只想跳過，反正電腦會算。"}, {"role": "導讀", "text": "電腦會算，但知道每個維度在放什麼，能幫你抓出很多錯。像一列是一個樣本，還是一個特徵，搞反了，後面全都跟著歪。"}, {"role": "學習者", "text": "所以矩陣相乘的尺寸，不只是考試故意刁難。"}, {"role": "導讀", "text": "它在問兩邊的東西能不能接起來。輸入有幾個特徵，權重怎麼把它轉成下一層表示，尺寸會把這段關係說出來。"}, {"role": "學習者", "text": "那向量相似度，是不是數值越大就一定越像？"}, {"role": "導讀", "text": "得先知道用哪一種定義。內積會受到長度影響，餘弦相似度關心方向；不是任何大數字都能用同一個意思讀。"}, {"role": "學習者", "text": "這樣一想，線性代數好像是在描述資料怎麼被移動和比較。"}, {"role": "導讀", "text": "很貼切。降維、投影和矩陣分解，也都可以往這個方向想：保留哪些結構，又捨掉了哪些資訊，而不只是把字母乘在一起。"}], "practiceCount": 8, "duration": 68.22, "file": "audio/podcast-mf/L23102.mp3", "bytes": 409916, "sha256": "dc87763bf4d8c52b859c0607ad0847086eb85b47a93417fae9627113ac097d65", "peakDb": -4.0, "decode": "pass"}, {"code": "L23103", "title": "數值優化技術與方法", "dialogue": [{"role": "學習者", "text": "模型訓練是不是像一直往山谷下面走，走到最低的地方就結束？"}, {"role": "導讀", "text": "梯度下降確實有這種直覺。不過你一次走多大步、地形長什麼樣子，都會影響走得穩不穩，也不保證每次都找到同一個最佳位置。"}, {"role": "學習者", "text": "所以學習率太大，可能直接跨過谷底？"}, {"role": "導讀", "text": "可能來回震盪，甚至不收斂；太小又可能走得很慢。實際訓練還常用小批次資料估方向，所以路線也不會完全平滑。"}, {"role": "學習者", "text": "我以為訓練次數加多一點，就能把這些問題補回來。"}, {"role": "導讀", "text": "如果方向或設定不適合，一直走不一定有用。還可能越來越貼合訓練資料，卻沒有改善新資料的表現。"}, {"role": "學習者", "text": "那看損失曲線，不是只看最後有沒有下降。"}, {"role": "導讀", "text": "也可以看下降是否穩定，訓練和驗證有沒有分開走。曲線像是在留下腳印，能幫你判斷模型到底走到哪一種困境。"}], "practiceCount": 10, "duration": 64.88, "file": "audio/podcast-mf/L23103.mp3", "bytes": 389900, "sha256": "da71d43c6ef8412423247e480e0472560e3c8d8bafba20df4d51a797a253a9dc", "peakDb": -3.8, "decode": "pass"}, {"code": "L23201", "title": "機器學習原理與技術", "dialogue": [{"role": "學習者", "text": "我以前把機器學習想成：拿資料進去，算出一條規則，再把那條規則拿來用。這樣想會太簡單嗎？"}, {"role": "導讀", "text": "當起點很好。只是那條規則怎麼選、怎麼知道不是巧合，以及能不能用在新資料上，才是後面比較有趣的地方。"}, {"role": "學習者", "text": "所以模型不是學到唯一正解，而是在一群可能的做法裡挑一個。"}, {"role": "導讀", "text": "對，還受資料、模型假設和目標影響。同一批資料，換個損失函數或限制，可能就偏好另一種解法。"}, {"role": "學習者", "text": "那模型在訓練資料上錯得越少，總該越好吧？"}, {"role": "導讀", "text": "如果只是把每個細節背熟，遇到新樣本反而容易失手。這就是為什麼不能只用做過的題目，替它證明已經學會。"}, {"role": "學習者", "text": "有點像我認得練習本上的答案，換個問法卻卡住。"}, {"role": "導讀", "text": "正是那個感覺。資料切分、驗證和控制複雜度，都是在試著分辨：它抓到的是可用的規律，還是只有這本練習本的紋路。"}], "practiceCount": 0, "duration": 69.18, "file": "audio/podcast-mf/L23201.mp3", "bytes": 415676, "sha256": "0d7bb1ba310878916401177b9c24720709b67c7a185ee1371c4d8d8543c556ed", "peakDb": -3.1, "decode": "pass"}, {"code": "L23202", "title": "常見機器學習演算法", "dialogue": [{"role": "學習者", "text": "演算法名字太多，我是不是得先選一個最紅的來學，其他就放著？"}, {"role": "導讀", "text": "可以從熟悉的一種開始，但要知道它擅長的問題。線性模型、樹模型、近鄰法或分群方法，對資料的想像不太一樣。"}, {"role": "學習者", "text": "像近鄰法，就是找跟這個樣本比較像的例子？"}, {"role": "導讀", "text": "對，所以「像不像」怎麼算很重要。特徵尺度差很多時，數字範圍大的那一欄，就可能主導距離。"}, {"role": "學習者", "text": "那樹模型也一定要做同樣的標準化嗎？"}, {"role": "導讀", "text": "不一定。不同模型對尺度、缺值或非線性關係的反應不同，不能把一個模型前面的處理流程，原封不動搬到每一種模型。"}, {"role": "學習者", "text": "所以比較模型，也是在比較它們各自的假設。"}, {"role": "導讀", "text": "再加上資料和資源。能不能解釋、訓練多久、預測要多快，都會影響選擇，不是排行榜高一點就適合每個場景。"}], "practiceCount": 8, "duration": 63.78, "file": "audio/podcast-mf/L23202.mp3", "bytes": 383276, "sha256": "d8dadb0d5c289d1e5a80ce2358e7d3dd33bc804affeab224c90f6cd8a06c7435", "peakDb": -4.4, "decode": "pass"}, {"code": "L23203", "title": "深度學習原理與框架", "dialogue": [{"role": "學習者", "text": "神經網路的層數越多，是不是就越接近人腦，也越聰明？"}, {"role": "導讀", "text": "層數能增加表達能力，可是不能直接換算成像人腦的程度。資料、架構、訓練和任務都會影響結果，也不保證越深越好。"}, {"role": "學習者", "text": "那框架替我做自動微分，我是不是連梯度都不用懂？"}, {"role": "導讀", "text": "它會幫你算，但知道損失怎麼連回參數，出問題時還是很重要。像張量尺寸不合、梯度不穩定，框架不會替你決定真正的問題在哪。"}, {"role": "學習者", "text": "我也常搞不清楚，模型訓練時和拿來預測時，為什麼還要切模式。"}, {"role": "導讀", "text": "因為有些層的行為會不同，像Dropout和某些正規化層。模式沒切對，結果可能連重跑幾次都不太一樣。"}, {"role": "學習者", "text": "原來寫幾行框架程式，是把一部分計算交出去，不是把判斷也交出去。"}, {"role": "導讀", "text": "對。理解資料怎麼進、損失怎麼算、模型怎麼被評估，還是那張能讓你看懂整條路線的地圖。"}], "practiceCount": 18, "duration": 68.99, "file": "audio/podcast-mf/L23203.mp3", "bytes": 414524, "sha256": "9084b1a93da7091cbb4e6ed67b7cfcfb1ef36ca5ef3d23ecb01c9e0ff3879778", "peakDb": -3.6, "decode": "pass"}, {"code": "L23301", "title": "數據準備與特徵工程", "dialogue": [{"role": "學習者", "text": "我有一個欄位跟結果特別有關，放進去之後分數立刻暴衝，這算撿到寶嗎？"}, {"role": "導讀", "text": "有可能，也可能先問一句：做預測的那個時間點，真的已經知道這個欄位了嗎？如果事後才會填，它可能把答案偷偷帶進來。"}, {"role": "學習者", "text": "像客服結案之後的滿意度，拿去預測這通電話會不會被客訴。"}, {"role": "導讀", "text": "這就很可疑。還有補值、編碼或特徵篩選，如果先看完整資料才切訓練和測試，也可能讓資訊穿過了本來的界線。"}, {"role": "學習者", "text": "那特徵越多，不就越容易踩到這些坑？"}, {"role": "導讀", "text": "多不一定壞，但每一欄都值得問來源、時間和用途。把無關或不穩定的訊號放進來，也可能增加維護負擔。"}, {"role": "學習者", "text": "所以特徵工程不是單純多算幾個新欄位。"}, {"role": "導讀", "text": "它其實在決定模型看得見哪一種世界。資料真的代表什麼，比你把欄位名字取得多專業，重要得多。"}], "practiceCount": 6, "duration": 65.24, "file": "audio/podcast-mf/L23301.mp3", "bytes": 392060, "sha256": "1ff3674437415ec71715b386345dedb25805bbfe0e3ca39666f9fcfe8c2b6b6a", "peakDb": -4.0, "decode": "pass"}, {"code": "L23302", "title": "模型選擇與架構設計", "dialogue": [{"role": "學習者", "text": "我想直接拿一個最大的模型來做，這樣應該比較不容易漏掉複雜關係。"}, {"role": "導讀", "text": "如果資料不多，最大的模型也可能最容易把細節背熟。我會先試一個簡單基準，看看問題到底難在哪裡。"}, {"role": "學習者", "text": "那架構怎麼選？看到文字就一定用同一種模型嗎？"}, {"role": "導讀", "text": "還要看你要做分類、找片段，還是生成長文，以及資料量、延遲和部署條件。相同資料形式，不代表需求相同。"}, {"role": "學習者", "text": "如果現成模型已經做得不錯，是不是不用從頭訓練？"}, {"role": "導讀", "text": "常常值得先評估遷移或微調，但仍然要看資料和用途合不合。把原來學到的東西搬過來，不代表所有領域都能直接套用。"}, {"role": "學習者", "text": "我開始覺得「最適合」比「最大」難回答很多。"}, {"role": "導讀", "text": "也比較接近真實工作。把品質、成本、解釋和現場限制擺在同一張桌上，選擇就不會只剩參數有幾個。"}], "practiceCount": 6, "duration": 65.82, "file": "audio/podcast-mf/L23302.mp3", "bytes": 395516, "sha256": "97131bde64ff2c5ba85d2da45ecac4d6c7f7bed99483620bb87bd4f51ad12605", "peakDb": -4.3, "decode": "pass"}, {"code": "L23303", "title": "模型訓練、評估與驗證", "dialogue": [{"role": "學習者", "text": "我的測試集準確率很高，可是少數重要案例還是一直漏掉，這是不是模型其實沒有那麼好？"}, {"role": "導讀", "text": "要看你原本想解決什麼。如果漏掉那群人的代價很高，只看總準確率，就可能把真正的問題藏起來。"}, {"role": "學習者", "text": "那精確率和召回率，我總是很容易記反。"}, {"role": "導讀", "text": "可以想成：挑出來的這一袋，有多少真的對，是精確率；所有應該找出的東西，你找回多少，是召回率。門檻一調，兩邊常常一起變動。"}, {"role": "學習者", "text": "所以不能只說我把某個指標拉高，卻不談另一邊付出什麼。"}, {"role": "導讀", "text": "也要看資料切分。時間序列如果隨便打散，或同一個人的資料跑到兩邊，評估可能比真實上線樂觀。"}, {"role": "學習者", "text": "那交叉驗證也不是一個按下去就永遠公平的按鈕。"}, {"role": "導讀", "text": "沒錯，它仍然要尊重資料結構。比較可信的測試，是盡量像未來會遇到的情況，而不是挑一個讓分數最好看的切法。"}], "practiceCount": 20, "duration": 67.84, "file": "audio/podcast-mf/L23303.mp3", "bytes": 407612, "sha256": "f12702a9db92157c8989f5864cf4555aa1dd5e46150066cb0fdc4d7fce146908", "peakDb": -4.1, "decode": "pass"}, {"code": "L23304", "title": "模型調整與優化", "dialogue": [{"role": "學習者", "text": "驗證分數還差一點，我是不是再多試幾組參數，總會找到一組比較好的？"}, {"role": "導讀", "text": "可能會，可是一直對著同一份驗證資料調，也會慢慢適應它。最後還得留一份沒有參與選擇的測試資料，才看得比較清楚。"}, {"role": "學習者", "text": "原來不是只有訓練集會被我「用熟」。"}, {"role": "導讀", "text": "對，人的選擇也會把資訊帶進流程。調參次數、比較方式和紀錄，都會影響你對最後結果有多大把握。"}, {"role": "學習者", "text": "如果訓練很好、驗證卻變差，我加更多訓練輪數就不太對了。"}, {"role": "導讀", "text": "可能要看正則化、模型複雜度、資料或提前停止等做法；如果連訓練都學不好，又是另一種問題，不能都用同一招。"}, {"role": "學習者", "text": "所以優化不只是把每個旋鈕轉一輪，選最高的數字。"}, {"role": "導讀", "text": "更像根據症狀找原因。知道是哪一種落差，再改一個有理由的設定，也比較能解釋為什麼這次真的有進步。"}], "practiceCount": 4, "duration": 65.08, "file": "audio/podcast-mf/L23304.mp3", "bytes": 391052, "sha256": "119a1ca2201835ac27a3e0048d75eaee1cd6817056e1650c86348b20179dc35c", "peakDb": -3.8, "decode": "pass"}, {"code": "L23401", "title": "數據隱私、安全與合規", "dialogue": [{"role": "學習者", "text": "我以為把模型放在公司裡跑，資料就不會外洩，也比較不需要管合規。"}, {"role": "導讀", "text": "本機部署能改變一些資料流向，但誰有權限、紀錄存在哪裡、輸出能不能帶出敏感內容，還是得管理。"}, {"role": "學習者", "text": "那模型本身也可能透露訓練資料的資訊？"}, {"role": "導讀", "text": "有這類風險，所以不能只看資料進去之前的保護。訓練、模型存取、日誌和輸出，都要放回同一條資料流程看。"}, {"role": "學習者", "text": "如果做了隱私保護，模型效果掉了一點，是不是就算失敗？"}, {"role": "導讀", "text": "通常得看保護了什麼，以及業務能接受多少誤差。像差分隱私會限制個人參與對輸出分布的影響，保護與效用就需要一起評估。"}, {"role": "學習者", "text": "原來安全不是加一個功能，就能把其他判斷全部省掉。"}, {"role": "導讀", "text": "法律適用也一樣。臺灣法規、國外制度和技術框架各有範圍，真的引用具體條文時，版本和施行狀態還是要分清楚。"}], "practiceCount": 3, "duration": 66.28, "file": "audio/podcast-mf/L23401.mp3", "bytes": 398252, "sha256": "21b456dcd439bf8ec5ed2e6451f951ee13e8fda8b609df28439a26b9d17c0ac4", "peakDb": -3.4, "decode": "pass"}, {"code": "L23402", "title": "演算法偏見與公平性", "dialogue": [{"role": "學習者", "text": "模型沒有看到性別欄位，我是不是就可以說它沒有性別偏見？"}, {"role": "導讀", "text": "還不行。其他欄位可能和性別有關，資料原本怎麼收集、標籤怎麼決定，也可能把差異帶進去。"}, {"role": "學習者", "text": "所以不給它看某一欄，不一定能把問題拿掉。"}, {"role": "導讀", "text": "對，而且公平有不同看法。看各群被選到的比例，跟看各群的錯誤率，關心的不是同一件事，有時候也不能同時滿足。"}, {"role": "學習者", "text": "那我不能找一個最喜歡的公平指標，就宣布全部過關。"}, {"role": "導讀", "text": "得先說清楚這個用途在意什麼、誰可能受影響，再一起看各群結果、資料條件和人工處理方式，而不是只報一個總分。"}, {"role": "學習者", "text": "我發現這類問題，最後常常回到誰有機會解釋和申訴。"}, {"role": "導讀", "text": "是啊。模型分數之外，也要有人看得見落差、能修正流程。公平不是替模型貼上的形容詞，還包含出錯之後怎麼對待人。"}], "practiceCount": 4, "duration": 66.56, "file": "audio/podcast-mf/L23402.mp3", "bytes": 399980, "sha256": "66714910dfb1d0b782677b54c4fcbb9d4ee23d384157696b21c0e3d4ee116731", "peakDb": -2.6, "decode": "pass"}];let current=0;const player=document.getElementById('player');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function pick(i){current=i;const x=lessons[i];player.pause();player.src=x.file;player.playbackRate=Number(document.getElementById('rate').value);document.getElementById('title').textContent=x.code+' '+x.title+'（'+Math.round(x.duration)+'秒）';document.getElementById('script').innerHTML=x.dialogue.map(d=>'<p><b>'+esc(d.role)+'：</b>'+esc(d.text)+'</p>').join('');const a=document.getElementById('download');a.href=x.file;a.download=x.code+'.mp3';document.getElementById('practice').textContent=x.practiceCount?'配套官方題 '+x.practiceCount+' 題。進入學習網站，在搜尋列輸入 '+x.code+'，先看文字再作答。':'本節目前無直接對應的官方題，請先口述概念與情境，不以自編題冒充歷屆題。';document.getElementById('previous').disabled=i===0;document.getElementById('next').disabled=i===lessons.length-1;}function list(){const q=document.getElementById('find').value.toLowerCase();const box=document.getElementById('list');box.replaceChildren();lessons.forEach((x,i)=>{if(!(x.code+' '+x.title).toLowerCase().includes(q))return;const b=document.createElement('button');b.textContent=x.code+' '+x.title;b.onclick=()=>pick(i);box.append(b);});}document.getElementById('previous').onclick=()=>pick(current-1);document.getElementById('next').onclick=()=>pick(current+1);document.getElementById('rate').onchange=e=>player.playbackRate=Number(e.target.value);document.getElementById('find').oninput=list;player.onended=()=>{if(document.getElementById('auto').checked&&current<lessons.length-1){pick(current+1);player.play().catch(()=>{document.getElementById('commuteStatus').textContent='無法自動播放，請按播放鍵繼續。';});}};const state=document.getElementById('commuteStatus');const stopAudio=()=>{player.pause();player.currentTime=0;state.textContent='已停止。';};document.getElementById('commuteStop').onclick=stopAudio;window.addEventListener('pagehide',stopAudio);player.addEventListener('play',()=>state.textContent='男女對談播放中');player.addEventListener('error',()=>state.textContent='音檔無法播放，請重試、下載MP3，或先閱讀文字稿。');player.addEventListener('loadedmetadata',()=>{player.playbackRate=Number(document.getElementById('rate').value);state.textContent=player.paused?'音檔已就緒。':'男女對談播放中';});list();pick(0);</script></html>

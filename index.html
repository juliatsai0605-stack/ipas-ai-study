.qnav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}

const dayNum=s=>Math.floor(Date.parse(s+"T00:00:00Z")/864e5);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

function logDay(ok){const k=today();const d=S.days[k]||{a:0,c:0};d.a++;if(ok)d.c++;S.days[k]=d;}
function recordQ(q,ok){const r=S.q[q.id]||[0,0,0,0];ok?r[0]++:r[1]++;r[2]=dayNum(today());r[3]=ok?1:0;S.q[q.id]=r;logDay(ok);}
const secQs=c=>BANK.filter(q=>q.sec===c);

function lastAcc(qs){let n=0,c=0;for(const q of qs){const r=S.q[q.id];if(r){n++;c+=r[3];}}return n?c/n:null;}
const seenN=qs=>qs.filter(q=>S.q[q.id]).length;
function secDone(sec){const qs=secQs(sec.code);return qs.length?(S.best[sec.code]||0)>=0.8:!!S.read[sec.code];}

// ---- readiness per subject ----
function readiness(s){
  const secs=subjSecs(s), qs=subjQs(s.code);
  const done=secs.filter(secDone).length;
  const seen=seenN(qs);
  const d=(S.drills[s.code]||[]).slice(-3);
  const drillOk=d.length===3&&d.every(x=>x>=0.85);
  const ms=S.mocks.filter(m=>m.sub===s.code);
  const mockOk=ms.length>0&&ms[ms.length-1].score>=85;
  const coverOk=seen>=Math.ceil(qs.length*0.8);
  return {secs:secs.length,done,qs:qs.length,seen,d,drillOk,mockOk,coverOk,ready:done===secs.length&&coverOk&&drillOk&&mockOk};
}
function phaseOf(r){return r.done<r.secs?1:(r.ready?3:2);}

// ---- unit page ----
function openUnit(code){
  if(SECS[code]&&SECS[code].lv!==S.lv){S.lv=SECS[code].lv;save();}
  quiz=null; go("unit",{sec:code});
}
function pickFor(pool,k){
  const wrong=shuffle(pool.filter(q=>{const r=S.q[q.id];return r&&r[3]===0;}));
  const unseen=shuffle(pool.filter(q=>!S.q[q.id]));
  const old=pool.filter(q=>{const r=S.q[q.id];return r&&r[3]===1;}).sort((a,b)=>S.q[a.id][2]-S.q[b.id][2]);
  const out=[],seen=new Set();for(const q of [...wrong,...unseen,...old]){if(!seen.has(q.id)){seen.add(q.id);out.push(q);}if(out.length>=k)break;}
  return out;
}
function vUnit(){
  const {sec,ch,subj}=SECS[V.sec];
  if(S.lastSec!==sec.code){S.lastSec=sec.code;save();}
  const ord=ORDER.filter(c=>SECS[c].lv===S.lv); const i=ord.indexOf(sec.code); const prev=ord[i-1],nxt=ord[i+1];

  const f=S.feyn[sec.code]||"";
  let h=`<div class="sec-head"><span class="note">${subj.code} ${esc(subj.name)} ／ ${ch.code} ${esc(ch.name)}</span><span class="code">${sec.code}</span><h2>${esc(sec.name)}</h2></div>

  <details class="card" ${f?"open":""}><summary>用自己的話說說看</summary><p class="small" style="margin-top:8px">${esc(sec.feyn)}</p><textarea id="feyn" aria-label="我的說明" placeholder="寫給完全不懂的人聽；卡住講不清楚的地方，就是要回頭重讀的地方。">${esc(f)}</textarea><div class="keys" id="keys"></div></details>`;
  if(qs.length){
    h+=`<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">單元測驗（${quiz.list.length} 題官方試題）</h3><span class="small muted">本單元題庫 ${qs.length} 題・已做 ${seenN(qs)}${S.best[sec.code]!==undefined?"・最佳 "+pct(S.best[sec.code]):""}</span></div><div style="display:grid;gap:18px;margin-top:12px" id="qbox">${quiz.list.map((q,k)=>qHTML(q,k)).join("")}</div><p id="res" class="small" style="margin-top:12px" hidden></p></div>`;
  } else {
    h+=`<div class="card"><p>本單元目前沒有歸入的官方試題。讀完重點並完成自我檢查後，標記為完成。</p><div class="row" style="margin-top:10px"><button class="btn" id="markRead">${S.read[sec.code]?"已完成":"標記為完成"}</button></div></div>`;
  }
  h+=`<div class="qnav">${prev?`<button class="btn soft sm" id="prevSec">← ${prev} ${esc(SECS[prev].sec.name)}</button>`:"<span></span>"}${nxt?`<button class="btn soft sm" id="nextSec">${nxt} ${esc(SECS[nxt].sec.name)} →</button>`:""}</div>`;
  $("#main").innerHTML=`<div class="view">${h}</div>`;
  document.querySelectorAll(".qa button").forEach(b=>b.onclick=()=>{const a=b.querySelector(".a");a.hidden=!a.hidden;});
  const ta=$("#feyn"),keys=()=>{const t=ta.value;$("#keys").innerHTML=t?sec.keys.map(k=>`<span class="${t.includes(k)?"hit":""}">${esc(k)}</span>`).join("")+`<span style="border:0">涵蓋 ${sec.keys.filter(k=>t.includes(k)).length}/${sec.keys.length} 個關鍵詞</span>`:"";};
  keys(); let tm; ta.oninput=()=>{keys();clearTimeout(tm);tm=setTimeout(()=>{S.feyn[sec.code]=ta.value;save();},600);};
  const on=(id,fn)=>{const e=$("#"+id);if(e)e.onclick=fn;};
  on("prevSec",()=>openUnit(prev)); on("nextSec",()=>openUnit(nxt));
  on("markRead",()=>{S.read[sec.code]=Date.now();save();render();});
  if(qs.length){
    quiz.list.forEach(q=>{
      const el=document.querySelector(`.q[data-id="${q.id}"]`);
      if(quiz.ans[q.id]!==undefined){showAnswered(el,q,quiz.ans[q.id]);return;}
      bindQ(el,q,(ok,j)=>{quiz.ans[q.id]=j;if(ok)quiz.c++;
        if(Object.keys(quiz.ans).length===quiz.list.length){const sc=quiz.c/quiz.list.length;S.best[sec.code]=Math.max(S.best[sec.code]||0,sc);S.read[sec.code]=S.read[sec.code]||Date.now();save();renderToc();showRes();}});
    });
    if(Object.keys(quiz.ans).length===quiz.list.length)showRes();
  }
  function showRes(){const sc=quiz.c/quiz.list.length;const r=$("#res");r.hidden=false;
    r.innerHTML=`<b>本次 ${quiz.c}/${quiz.list.length}（${pct(sc)}）</b>　${sc>=0.8?"本單元完成。":"未達 80%，請看錯題解析並回頭讀重點，再測一次。"}　<button class="btn sm" id="again">再測一次（換題）</button>${nxt?` <button class="btn ghost sm" id="goNx">下一單元</button>`:""}`;
    $("#again").onclick=()=>{quiz=null;render();};const g=$("#goNx");if(g)g.onclick=()=>openUnit(nxt);}
}

  const ctx=q.ctx?`<div class="ctx">${esc(q.ctx)}</div>`:"";

// ---- drill ----
function startDrill(sub,mode,k){
  const pool=subjQs(sub); let list;
  if(mode==="wrong") list=shuffle(pool.filter(q=>{const r=S.q[q.id];return r&&r[3]===0;}));
  else if(mode==="unseen") list=shuffle(pool.filter(q=>!S.q[q.id])).slice(0,k);
  else list=shuffle(pickFor(pool,k));
  drill={sub,mode,list,i:0,c:0,ans:null}; go("drill");
}
function vDrill(){

    <div class="row" style="margin-top:14px"><button class="btn" id="dSmart">智慧出題</button><button class="btn ghost" id="dWrong">錯題本</button><button class="btn ghost" id="dUnseen">只做沒做過的</button></div></div>
    <div class="card"><h3>各科概況</h3><div class="tbl"><table><thead><tr><th>科目</th><th class="num">已做</th><th class="num">目前答錯</th><th class="num">最近正確率</th><th>近期刷題</th></tr></thead><tbody>${lv.subjects.map(s=>{const qs=subjQs(s.code);const w=qs.filter(q=>S.q[q.id]&&S.q[q.id][3]===0).length;const la=lastAcc(qs);const d=(S.drills[s.code]||[]).slice(-5);return `<tr><td>${s.code} ${esc(s.name)}</td><td class="num">${seenN(qs)}/${qs.length}</td><td class="num">${w}</td><td class="num">${la===null?"—":pct(la)}</td><td><div class="hist">${d.map(x=>`<span class="${x>=0.85?"pass":""}">${pct(x)}</span>`).join("")||"—"}</div></td></tr>`;}).join("")}</tbody></table></div></div>`;

  }
  const d=drill;
  if(!d.list.length){$("#main").innerHTML=`<div class="view"><div class="card"><p>${d.mode==="wrong"?"目前沒有錯題。":"這一科的題目都做過了，改用智慧出題複習。"}</p><div class="row" style="margin-top:10px"><button class="btn" id="dBack">回刷題首頁</button></div></div></div>`;$("#dBack").onclick=()=>{drill=null;render();};return;}

    const sc=d.c/d.list.length;

}

function startMock(sub,x){
  const list=subjQs(sub).filter(q=>q.x===x).sort((a,b)=>a.n-b.n);
  mock={lv:S.lv,sub,x,list,ans:new Array(list.length).fill(null),i:0,left:(S.lv==="P"?75:90)*60,done:false};
  clearInterval(mockTimer);
  mockTimer=setInterval(()=>{if(!mock||mock.done){clearInterval(mockTimer);return;}mock.left--;const t=document.getElementById("tm");if(t)t.textContent=pad(Math.floor(mock.left/60))+":"+pad(mock.left%60);if(mock.left<=0)finishMock();},1000);
  go("mock");
}
function finishMock(){
  const m=mock;if(!m||m.done)return;clearInterval(mockTimer);m.done=true;
  let c=0;m.list.forEach((q,k)=>{if(m.ans[k]!=null){const ok=m.ans[k]===q.a;if(ok)c++;recordQ(q,ok);}});
  m.c=c;m.score=Math.round(c/m.list.length*100);
  const d=new Date();S.mocks.push({d:`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`,sub:m.sub,x:m.x,score:m.score});save();go("mock");

// ---- me ----
function curveSVG(n){
  const W=560,H=200,pl=34,pr=36,pt=12,pb=26,base=dayNum(today()),days=[];
  for(let i=n-1;i>=0;i--){const dt=new Date((base-i)*864e5);const k=dt.getUTCFullYear()+"-"+pad(dt.getUTCMonth()+1)+"-"+pad(dt.getUTCDate());days.push({k,d:S.days[k]||{a:0,c:0}});}
  const top=Math.ceil(Math.max(10,...days.map(x=>x.d.a))/10)*10,bw=(W-pl-pr)/n,ih=H-pt-pb;
  let g="";[0,.5,1].forEach(f=>{const y=pt+ih*(1-f);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${W-pr+4}" y="${y+4}">${Math.round(f*100)}%</text><text x="${pl-4}" y="${y+4}" text-anchor="end">${Math.round(top*f)}</text>`;});
  let bars="";const pts=[];
  days.forEach((x,i)=>{const h=ih*x.d.a/top,X=pl+i*bw;bars+=`<rect x="${X+1}" y="${H-pb-h}" width="${Math.max(bw-2,1)}" height="${h}" fill="var(--ai-soft)" stroke="var(--ai)" stroke-width=".5"><title>${x.k}：${x.d.a} 題</title></rect>`;if(x.d.a)pts.push([X+bw/2,pt+ih*(1-x.d.c/x.d.a),x]);});
  const line=pts.length>1?`<polyline points="${pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}" fill="none" stroke="var(--matcha)" stroke-width="2"/>`:"";
  const dots=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--matcha)"><title>${p[2].k}：正確率 ${pct(p[2].d.c/p[2].d.a)}</title></circle>`).join("");
  const lbl=[0,Math.floor(n/2),n-1].map(i=>`<text x="${pl+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${days[i].k.slice(5).replace("-","/")}</text>`).join("");
  const empty=pts.length?"":`<text x="${W/2}" y="${H/2}" text-anchor="middle">開始作答後，這裡會畫出每天的題數與正確率</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="近 ${n} 天每日作答題數與正確率">${g}${bars}${line}${dots}${lbl}${empty}</svg><div class="legend"><span><i style="background:var(--ai-soft);border:1px solid var(--ai)"></i>每日作答題數（左軸）</span><span><i style="background:var(--matcha)"></i>每日正確率（右軸）</span></div>`;
}

  document.querySelectorAll("[data-st]").forEach(s=>s.onchange=()=>{if(s.value)S.status[s.dataset.st]="pass";else delete S.status[s.dataset.st];save();renderToc();});
  $("#exp").onclick=()=>{const blob=new Blob([JSON.stringify(S)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`ipas-ai-progress-${today()}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);$("#bk").textContent="已下載備份檔。";};
  $("#impF").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o.q!=="object"||typeof o.days!=="object")throw 0;S=Object.assign(blank(),o,{v:4});save();$("#bk").textContent="已匯入備份。";render();}catch(x){$("#bk").textContent="檔案格式不符，請選擇本站匯出的備份檔。";}};r.readAsText(f);};
  $("#rstB").onclick=()=>{$("#rst").innerHTML=`<span class="small">確定清除全部作答與紀錄？無法復原。</span><button class="btn sm" id="ry">清除</button><button class="btn soft sm" id="rn">取消</button>`;$("#ry").onclick=()=>{S=blank();save();render();};$("#rn").onclick=()=>render();};
}

// ---- boot ----
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{S.lv=b.dataset.lv;save();drill=null;quiz=null;V.subj=null;if(V.view==="unit"||V.view==="diag")V.view="units";render();});
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{if(b.dataset.v==="drill")drill=null;go(b.dataset.v);});
$("#tocBtn").onclick=()=>{if(window.matchMedia("(min-width:901px)").matches){S.toc=!S.toc;save();render();}else{$("#toc").classList.add("open");$("#drawerBg").classList.add("open");}};
$("#drawerBg").onclick=closeDrawer;
window.matchMedia("(min-width:901px)").addEventListener("change",()=>{closeDrawer();render();});
Promise.all([fetch("course.json").then(r=>r.json()),fetch("bank.json").then(r=>r.json())]).then(([c,b])=>{
  COURSE=c;BANK=b;
  for(const lv of COURSE.levels)for(const s of lv.subjects)for(const ch of s.chapters)for(const sec of ch.sections){SECS[sec.code]={sec,ch,subj:s,lv:lv.id};ORDER.push(sec.code);}
  ayiaState("welcome");
  render();
}).catch(()=>{$("#main").innerHTML=`<div class="card">題庫載入失敗，請重新整理頁面。</div>`;});
})();
</script>
</body>
</html>

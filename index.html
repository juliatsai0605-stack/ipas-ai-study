<style>
/* Layout: sticky top bar; collapsible outline (目次) on the left; reading column on the right. */
:root{
  --paper:#f6f2ea; --card:#fffdf8; --ink:#34302b; --muted:#7b7368; --line:#e4ddd0;
  --matcha:#5f7d4b; --matcha-soft:#e7eedd; --kaki:#bf6534; --kaki-soft:#f7e6da; --ai:#46627e; --ai-soft:#e2e9f0;
  --ok:#4f7d48; --ok-soft:#e3efdc; --ng:#b2493c; --ng-soft:#f6e2dd;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#1f1d1a; --card:#282521; --ink:#ece6db; --muted:#a69d90; --line:#3a3530;
  --matcha:#9db585; --matcha-soft:#2e3828; --kaki:#e0936a; --kaki-soft:#43291c; --ai:#93b2cd; --ai-soft:#24303b;
  --ok:#8fc285; --ok-soft:#263a24; --ng:#e48b7e; --ng-soft:#42241f; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.8;letter-spacing:.01em;padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;line-height:1.4;margin:0;text-wrap:balance}
h1{font-size:1.2rem} h2{font-size:1.4rem} h3{font-size:1.08rem} h4{font-size:.98rem}
p{margin:0}
a{color:var(--ai)}
button,select,input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
img{max-width:100%}
:focus-visible{outline:2px solid var(--matcha);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:10px 14px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;min-width:0}
.seal{display:inline-grid;place-items:center;width:26px;height:26px;border:1.5px solid var(--kaki);color:var(--kaki);border-radius:4px;font-family:var(--f-display);font-size:.8rem;flex:none}
.brand small{color:var(--muted);font-size:.76rem}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:.88rem;display:inline-flex;align-items:center;gap:6px}
.iconbtn[aria-pressed="true"]{background:var(--matcha-soft);border-color:var(--matcha)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.seg button{border:0;background:none;padding:4px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:none;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--muted);white-space:nowrap;font-size:.94rem}
.tabs button[aria-current="true"]{color:var(--ink);background:var(--matcha-soft);font-weight:500}
.shell{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px;padding:20px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
.shell.noToc{grid-template-columns:minmax(0,1fr);max-width:900px}
.toc{position:sticky;top:70px;align-self:start;max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}
.toc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.toc-head span{font-size:.8rem;letter-spacing:.12em;color:var(--muted)}
.toc .subj{margin-bottom:14px}
.toc .subj>div:first-child{font-family:var(--f-display);font-weight:700;font-size:.96rem;display:flex;justify-content:space-between;gap:8px;align-items:center}
.toc .ch{margin:6px 0 2px;color:var(--muted);font-size:.8rem}
.toc button.sec{display:flex;gap:8px;width:100%;text-align:left;border:0;background:none;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:.88rem;line-height:1.5;align-items:flex-start}
.toc button.sec:hover{background:var(--card)}
.toc button.sec[aria-current="true"]{background:var(--matcha-soft)}
.toc .code{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.74rem;min-width:3.6em;padding-top:2px}
.toc .nm{flex:1;min-width:0}
.mark{font-size:.72rem;padding-top:2px;color:var(--muted);white-space:nowrap}
.mark.ok{color:var(--ok)}
.tag{font-size:.72rem;padding:1px 8px;border-radius:999px;background:var(--line);color:var(--muted);white-space:nowrap;font-family:var(--f-body);font-weight:500}
.tag.pass{background:var(--ok-soft);color:var(--ok)}
.tag.ai{background:var(--ai-soft);color:var(--ai)}
main{min-width:0}
.view{display:grid;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card>h3{margin-bottom:10px}
.muted{color:var(--muted)} .small{font-size:.86rem} .note{font-size:.82rem;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:500;font-size:.94rem}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.soft{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:default}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;list-style:none;padding:0;margin:0}
.steps li{border-top:4px solid var(--line);padding-top:8px;font-size:.88rem;color:var(--muted)}
.steps li.done{border-top-color:var(--ok);color:var(--ink)}
.steps li.now{border-top-color:var(--kaki);color:var(--ink);font-weight:500}
.steps b{display:block;font-size:.74rem;letter-spacing:.06em}
.advice{background:var(--matcha-soft);border-radius:12px;padding:16px 18px;display:grid;gap:8px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{border-top:2px solid var(--ink);padding-top:8px}
.stat span{display:block;font-size:.76rem;color:var(--muted);letter-spacing:.04em}
.stat strong{font-family:var(--f-display);font-size:1.45rem;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--matcha)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:.8rem}
.num{font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.check{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.check li{display:flex;gap:8px}
.check li::before{content:"○";color:var(--muted)}
.check li.ok::before{content:"✓";color:var(--ok);font-weight:700}
.unit-list{display:grid;gap:8px}
.unit{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer}
.unit:hover{border-color:var(--ink)}
.unit .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem;min-width:4em}
.unit .t{flex:1;min-width:0}
.pill{font-size:.75rem;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--line);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--ai-soft);color:var(--ai)}
.sec-head{display:grid;gap:4px}
.sec-head .code{font-family:var(--f-display);color:var(--kaki);letter-spacing:.08em}
.reading ol{padding-left:1.4em;margin:0;display:grid;gap:10px;max-width:70ch}
.reading li::marker{color:var(--kaki);font-family:var(--f-display)}
details.card summary{cursor:pointer;font-family:var(--f-display);font-weight:700;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"＋";float:right;color:var(--muted)}
details.card[open] summary::after{content:"－"}
.qa{display:grid;gap:8px;margin-top:10px}
.qa button{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;cursor:pointer;line-height:1.65}
.qa button .a{display:block;color:var(--ok);margin-top:4px}
textarea{width:100%;min-height:110px;line-height:1.7;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);resize:vertical}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.keys span{font-size:.8rem;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.keys span.hit{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.q{display:grid;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:0}
.q .meta{font-size:.78rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.q .stem{white-space:pre-wrap}
.q .ctx{font-size:.86rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;white-space:pre-wrap;max-height:9.5em;overflow:auto}
.q figure{margin:0;border:1px solid var(--line);border-radius:8px;overflow:auto;background:#fff}
.q figure img{display:block;max-width:100%;height:auto}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;line-height:1.65;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt b{font-family:var(--f-display);color:var(--muted);min-width:1.2em}
.opt.sel{border-color:var(--ai);background:var(--ai-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.exp{font-size:.94rem;background:var(--paper);border-radius:10px;padding:10px 12px;border-left:3px solid var(--matcha)}
.exp b.ok{color:var(--ok)} .exp b.ng{color:var(--ng)}
.qnav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.timer{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:1.1rem}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pills button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:.76rem;font-variant-numeric:tabular-nums;padding:0}
.pills button.ans{background:var(--ai-soft);border-color:var(--ai)}
.pills button.cur{outline:2px solid var(--ink)}
.hist{display:flex;gap:6px;flex-wrap:wrap}
.hist span{font-size:.8rem;font-variant-numeric:tabular-nums;padding:2px 8px;border-radius:6px;background:var(--line)}
.hist span.pass{background:var(--ok-soft);color:var(--ok)}
select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);max-width:100%}
.form{display:grid;gap:10px}
.form label{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.compare .card{border-top:3px solid var(--line)}
.compare .card.win{border-top-color:var(--matcha)}
.drawer-bg{display:none}
footer{max-width:1200px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));font-size:.8rem;color:var(--muted);display:grid;gap:6px}
@media (max-width:900px){
  .shell,.shell.noToc{grid-template-columns:minmax(0,1fr)}
  .toc{position:fixed;inset:0 auto 0 0;width:min(86vw,330px);max-height:none;background:var(--paper);z-index:20;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 24px max(16px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);transform:translateX(-105%);transition:transform .2s}
  .toc.open{transform:none}
  .toc[hidden]{display:block!important}
  .drawer-bg.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:15}
  .compare{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.brand small{display:none}.steps{font-size:.8rem}}
@media (prefers-reduced-motion:reduce){.toc{transition:none}}

/* Aiya free edition: readable anime-academy design, additive to the existing app */
:root{--paper:#f4f7ff;--card:#fff;--ink:#20294a;--muted:#525f7b;--line:#d8e1f5;--matcha:#585bc5;--matcha-soft:#eae9ff;--kaki:#7151bd;--kaki-soft:#f3eaff;--ai:#2856a6;--ai-soft:#eaf2ff;--ok:#246c54;--ok-soft:#e4f4ed;--ng:#a43453;--ng-soft:#fff0f3;--f-display:"Noto Sans TC",-apple-system,"Microsoft JhengHei",sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--paper:#f4f7ff;--card:#fff;--ink:#20294a;--muted:#525f7b;--line:#d8e1f5;--matcha:#585bc5;--matcha-soft:#eae9ff;--kaki:#7151bd;--kaki-soft:#f3eaff;--ai:#2856a6;--ai-soft:#eaf2ff;--ok:#246c54;--ok-soft:#e4f4ed;--ng:#a43453;--ng-soft:#fff0f3;color-scheme:light}}
body{background:radial-gradient(circle at 95% 0%,#e8e7ff 0,transparent 33%),radial-gradient(circle at 4% 25%,#e7f3ff 0,transparent 32%),var(--paper);color:var(--ink)}
.top{background:rgba(255,255,255,.97);box-shadow:0 4px 22px rgba(45,66,141,.06)}
.seal{border-color:var(--matcha);color:var(--matcha);background:var(--matcha-soft);border-radius:11px;font-family:var(--f-body);font-weight:700}
.brand h1{font-family:var(--f-body);font-size:1.06rem}
.card,.unit{box-shadow:0 7px 26px rgba(63,81,156,.045);border-radius:16px}
h1,h2,h3,h4{font-family:var(--f-body);letter-spacing:0}
button,.btn,.iconbtn{border-radius:11px}
.btn{background:#4847aa;color:#fff;border-color:#4847aa}
.btn.ghost{color:#34336f;border-color:#34336f}
.btn:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #404bb5;outline-offset:3px}
.reading{font-size:1.06rem;line-height:2;color:#20294a}
.reading li{margin-bottom:.45em}
.small,.note,.muted,th{color:#52617d}
.toc button.sec{padding:7px 8px}
.toc button.sec[aria-current=true]{background:#e7ebff;color:#273681}
.ayia-panel{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:14px;background:linear-gradient(125deg,#f5f2ff,#eaf5ff);border:1px solid #cfdafa;border-radius:18px;padding:13px 16px;margin-bottom:16px;box-shadow:0 6px 22px #3449a00e}
.ayia-face{width:70px;height:70px;border:2px solid #b1bef7;border-radius:24px;display:grid;place-items:center;font-size:2.6rem;background:#fff;flex-shrink:0;position:relative}
.ayia-face::after{content:"✦";position:absolute;right:-6px;top:-12px;color:#dd9d3d;font-size:1.2rem}
.ayia-panel strong{color:#32358f;font-size:1rem}
.ayia-panel p{line-height:1.55;font-size:.95rem;margin:3px 0 7px}
.ayia-actions{display:flex;gap:8px;flex-wrap:wrap}
.ayia-actions button{background:#fff;border:1px solid #b6c8e7;color:#263f82;padding:4px 10px;font-size:.82rem;cursor:pointer}
.free-tag{font-size:.73rem;background:#e5f7ef;color:#21644c;padding:2px 8px;border-radius:999px;font-weight:700;white-space:nowrap}
.ayia-quick{border:1px solid #cbd7f7;background:#f2f5ff;border-radius:14px;padding:13px 15px;margin-bottom:14px}
.ayia-quick h3{font-size:1rem;margin-bottom:5px}
.ayia-quick p{font-size:.9rem;margin-bottom:9px}
@media(max-width:680px){.ayia-panel{grid-template-columns:56px minmax(0,1fr);padding:11px;gap:11px}.ayia-face{height:54px;width:54px;font-size:1.8rem}.brand h1{font-size:.95rem}.free-tag{font-size:.69rem}.reading{font-size:1.02rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}


/* Illustration-led dashboard, faithfully structured after approved anime laboratory preview. */
body{background:#f5f7ff}
.shell:has(.dash){max-width:1480px;grid-template-columns:225px minmax(0,1fr);gap:22px}
.shell:has(.dash) main{width:100%}
.shell:has(.dash) .toc{background:rgba(255,255,255,.9);border:1px solid #e1e6f5;border-radius:18px;padding:17px 12px}
.shell:has(.dash) .ayia-panel{display:none}
.dash{display:grid;gap:22px;font-size:15px;line-height:1.6}
.dash-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:3px 4px}
.dash-eyebrow{font-size:.75rem;letter-spacing:.1em;font-weight:800;color:#6867b5}
.dash-heading h2{font-size:1.75rem;color:#27365f;letter-spacing:-.025em;margin:4px 0}
.dash-heading p,.dash-sub{color:#576584;font-size:.9rem}
.dash-spark{color:#b6a2e9}
.dash-switch{display:flex;align-items:center;gap:8px;font-weight:700;color:#43527b;font-size:.85rem}
.dash-switch select{background:#fff;border:1px solid #cbd6ed;border-radius:12px;padding:8px;max-width:280px}
.dash-hero{min-height:285px;position:relative;overflow:hidden;border:1px solid #cfdcfb;border-radius:25px;display:grid;grid-template-columns:1.4fr 1fr;background:radial-gradient(circle at 73% 32%,#fbefff 0 14%,transparent 42%),linear-gradient(115deg,#e7f3ff,#ede7ff 80%);box-shadow:0 10px 34px #5f76ba12}
.dash-hero:before,.dash-hero:after{position:absolute;content:"✦";font-size:60px;color:#ffffffb6;right:38%;top:12px}
.dash-hero:after{content:"✧";font-size:40px;right:5%;top:28px}
.dash-hero-copy{padding:28px 18px 28px 36px;position:relative;z-index:1;max-width:580px}
.dash-label{display:inline-block;background:#ffffffc7;border:1px solid #dae2fc;border-radius:20px;padding:5px 13px;font-size:.78rem;font-weight:700;color:#4d59a4}
.dash-hero h2{font-size:clamp(1.45rem,2.7vw,2.45rem);line-height:1.4;color:#2d3b75;margin:13px 0}
.dash-hero h2 span{color:#6658b6}
.dash-hero p{color:#49577f;font-size:.96rem;max-width:34em;margin-bottom:16px}
.dash-primary{max-width:100%;white-space:normal;text-align:left;background:#5c57bb;border:0;border-radius:15px;box-shadow:0 5px 14px #5954ba30}
.dash-character{width:270px;height:260px;position:relative;align-self:end;justify-self:center;filter:drop-shadow(0 12px 14px #6c7ec12b)}
.dash-halo{position:absolute;width:210px;height:210px;background:radial-gradient(circle,#fffe 10%,#d8e6ff 72%,transparent 73%);border-radius:50%;top:10px;left:34px}
.dash-hair{position:absolute;top:28px;left:60px;width:150px;height:150px;border-radius:48% 48% 40% 40%;background:linear-gradient(145deg,#8fd3ef,#998adc);box-shadow:inset -13px -5px 0 #7b8bd4}

function attachmentDB(){return new Promise((resolve,reject)=>{if(!("indexedDB" in window))return reject(Error("此瀏覽器不支援本機附件"));const req=indexedDB.open("ipas-ai-study-attachments",1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains("files"))db.createObjectStore("files",{keyPath:"id"});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||Error("開啟本機檔案庫失敗"));});}
async function attachmentAction(mode,value){const db=await attachmentDB();try{return await new Promise((resolve,reject)=>{const tx=db.transaction("files",mode==="get"?"readonly":"readwrite"),store=tx.objectStore("files"),req=mode==="put"?store.put(value):mode==="delete"?store.delete(value):mode==="clear"?store.clear():store.get(value);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||Error("附件操作失敗"));tx.onabort=()=>reject(tx.error||Error("附件操作已中止"));});}finally{db.close();}}

function learningStreak(){let days=0,day=new Date();const activity=k=>(S.days[k]?.a||0)>0||(S.studySeconds?.[k]||0)>=60;

// ---- readiness per subject ----
function readiness(s){
  const secs=subjSecs(s), qs=subjQs(s.code);
  const done=secs.filter(secDone).length;
  const seen=seenN(qs);
  const d=(S.drills[s.code]||[]).slice(-3);
  const drillOk=d.length===3&&d.every(x=>x>=0.85);
  const ms=S.mocks.filter(m=>m.sub===s.code);
  const mockOk=ms.length>0&&ms[ms.length-1].score>=85;
  const coverOk=seen>=Math.ceil(qs.length*0.8);
  return {secs:secs.length,done,qs:qs.length,seen,d,drillOk,mockOk,coverOk,ready:done===secs.length&&coverOk&&drillOk&&mockOk};
}
function phaseOf(r){return r.done<r.secs?1:(r.ready?3:2);}

// ---- unit page ----
function openUnit(code){
  if(SECS[code]&&SECS[code].lv!==S.lv){S.lv=SECS[code].lv;save();}
  quiz=null; go("unit",{sec:code});
}
function pickFor(pool,k){
  const wrong=shuffle(pool.filter(q=>{const r=S.q[q.id];return r&&r[3]===0;}));
  const unseen=shuffle(pool.filter(q=>!S.q[q.id]));
  const old=pool.filter(q=>{const r=S.q[q.id];return r&&r[3]===1;}).sort((a,b)=>S.q[a.id][2]-S.q[b.id][2]);
  const out=[],seen=new Set();for(const q of [...wrong,...unseen,...old]){if(!seen.has(q.id)){seen.add(q.id);out.push(q);}if(out.length>=k)break;}
  return out;
}
function vUnit(){
  const {sec,ch,subj}=SECS[V.sec];

  <details class="card" ${f?"open":""}><summary>用自己的話說說看</summary><p class="small" style="margin-top:8px">${esc(sec.feyn)}</p><textarea id="feyn" aria-label="我的說明" placeholder="寫給完全不懂的人聽；卡住講不清楚的地方，就是要回頭重讀的地方。">${esc(f)}</textarea><div class="keys" id="keys"></div></details>`;
  if(qs.length){
    h+=`<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">單元測驗（${quiz.list.length} 題官方試題）</h3><span class="small muted">本單元題庫 ${qs.length} 題・已做 ${seenN(qs)}${S.best[sec.code]!==undefined?"・最佳 "+pct(S.best[sec.code]):""}</span></div><div style="display:grid;gap:18px;margin-top:12px" id="qbox">${quiz.list.map((q,k)=>qHTML(q,k)).join("")}</div><p id="res" class="small" style="margin-top:12px" hidden></p></div>`;
  } else {
    h+=`<div class="card"><p>本單元目前沒有歸入的官方試題。讀完重點並完成自我檢查後，標記為完成。</p><div class="row" style="margin-top:10px"><button class="btn" id="markRead">${S.read[sec.code]?"已完成":"標記為完成"}</button></div></div>`;
  }
  h+=`<div class="qnav">${prev?`<button class="btn soft sm" id="prevSec">← ${prev} ${esc(SECS[prev].sec.name)}</button>`:"<span></span>"}${nxt?`<button class="btn soft sm" id="nextSec">${nxt} ${esc(SECS[nxt].sec.name)} →</button>`:""}</div>`;
  $("#main").innerHTML=`<div class="view">${h}</div>`;

  document.querySelectorAll(".qa button").forEach(b=>b.onclick=()=>{const a=b.querySelector(".a");a.hidden=!a.hidden;});
  const ta=$("#feyn"),keys=()=>{const t=ta.value;$("#keys").innerHTML=t?sec.keys.map(k=>`<span class="${t.includes(k)?"hit":""}">${esc(k)}</span>`).join("")+`<span style="border:0">涵蓋 ${sec.keys.filter(k=>t.includes(k)).length}/${sec.keys.length} 個關鍵詞</span>`:"";};
  keys(); let tm; ta.oninput=()=>{keys();clearTimeout(tm);tm=setTimeout(()=>{S.feyn[sec.code]=ta.value;save();},600);};

    $("#again").onclick=()=>{quiz=null;render();};const g=$("#goNx");if(g)g.onclick=()=>openUnit(nxt);}

}

// ---- drill ----
function startDrill(sub,mode,k){
  const pool=subjQs(sub); let list;
  if(mode==="review")list=shuffle(pool.filter(q=>S.srs?.[q.id]&&S.srs[q.id].due<=dayNum(today()))).slice(0,k);
  else if(mode==="wrong") list=shuffle(pool.filter(q=>{const r=S.q[q.id];return r&&r[3]===0;})).slice(0,k);
  else if(mode==="unseen") list=shuffle(pool.filter(q=>!S.q[q.id])).slice(0,k);
  else list=shuffle(pickFor(pool,k));
  drill={sub,mode,list,i:0,c:0,ans:null}; go("drill");
}
function vDrill(){
  const lv=lvObj();
  if(!drill||!lv.subjects.some(s=>s.code===drill.sub)){
    const def=(openSubjects()[0]||lv.subjects[0]).code;
    let h=`<div class="card"><h3>刷題・${esc(lv.name)}</h3><p class="small muted">題目全部是官方公告試題，答完立刻看解析。「智慧出題」優先出：最近一次答錯的題 → 沒做過的題 → 最久沒複習的題，並混合各單元。</p>

    <label>題數 <select id="dK"><option>10</option><option selected>20</option><option>30</option><option>50</option></select></label></div>
    <div class="row" style="margin-top:14px"><button class="btn" id="dSmart">智慧出題</button><button class="btn ghost" id="dReview">今日到期複習</button><button class="btn ghost" id="dWrong">錯題本</button><button class="btn ghost" id="dUnseen">只做沒做過的</button></div></div>
    <div class="card"><h3>各科概況</h3><div class="tbl"><table><thead><tr><th>科目</th><th class="num">已做</th><th class="num">目前答錯</th><th class="num">最近正確率</th><th>近期刷題</th></tr></thead><tbody>${lv.subjects.map(s=>{const qs=subjQs(s.code);const w=qs.filter(q=>S.q[q.id]&&S.q[q.id][3]===0).length;const la=lastAcc(qs);const d=(S.drills[s.code]||[]).slice(-5);return `<tr><td>${s.code} ${esc(s.name)}</td><td class="num">${seenN(qs)}/${qs.length}</td><td class="num">${w}</td><td class="num">${la===null?"—":pct(la)}</td><td><div class="hist">${d.map(x=>`<span class="${x>=0.85?"pass":""}">${pct(x)}</span>`).join("")||"—"}</div></td></tr>`;}).join("")}</tbody></table></div></div>`;
    $("#main").innerHTML=`<div class="view">${h}</div>`;
    const sub=()=>$("#dSub").value,k=()=>+$("#dK").value;
    $("#dSmart").onclick=()=>startDrill(sub(),"smart",k());
    $("#dReview").onclick=()=>startDrill(sub(),"review",20);
    $("#dWrong").onclick=()=>startDrill(sub(),"wrong",999);
    $("#dUnseen").onclick=()=>startDrill(sub(),"unseen",k());
    return;
  }
  const d=drill;
  if(!d.list.length){$("#main").innerHTML=`<div class="view"><div class="card"><p>${d.mode==="wrong"?"目前沒有錯題。":d.mode==="review"?"今天沒有到期的間隔複習題，先學習新單元或智慧刷題。":"這一科的題目都做過了，改用智慧出題複習。"}</p><div class="row" style="margin-top:10px"><button class="btn" id="dBack">回刷題首頁</button></div></div></div>`;$("#dBack").onclick=()=>{drill=null;render();};return;}
  if(d.i>=d.list.length){

    if(d.mode==="smart"&&d.list.length>=10&&!d.logged){(S.drills[d.sub]=S.drills[d.sub]||[]).push(sc);d.logged=true;save();}
    $("#main").innerHTML=`<div class="view"><div class="card"><h3>本回 ${d.c}/${d.list.length}（${pct(sc)}）</h3><p>${sc>=0.85?"表現穩定，連續 3 回達 85% 就完成刷題條件。":sc>=0.7?"已過及格線 70%，答錯的題下回會優先出現。":"未達 70%，建議先回看錯題所屬單元的重點，再刷一回。"}</p>

  }
  const q=d.list[d.i];
  $("#main").innerHTML=`<div class="view"><div class="qnav"><span class="small muted">${d.sub}・第 ${d.i+1}/${d.list.length} 題・答對 ${d.c}</span><button class="btn soft sm" id="dQuit">結束這回</button></div><div class="bar"><i style="width:${d.i/d.list.length*100}%"></i></div><div class="card">${qHTML(q)}</div><div class="row"><button class="btn" id="dNext" hidden>${d.i+1<d.list.length?"下一題":"看結果"}</button></div></div>`;
  const el=$(".q");

  else bindQ(el,q,(ok,j)=>{d.ans=j;if(ok)d.c++;const n=$("#dNext");n.hidden=false;n.focus();});

  $("#dQuit").onclick=()=>{const n=d.i+(d.ans!==null?1:0);d.list=d.list.slice(0,n);d.i=n;d.ans=null;if(d.mode==="smart")d.mode="partial";if(!n){drill=null;}render();};
}

const sessionsOf=sub=>[...new Set(subjQs(sub).map(q=>q.x))].sort();
function vMock(){
  const lv=lvObj();
  if(!mock||mock.lv!==S.lv){
    let h=`<div class="card"><h3>整卷模擬考・${esc(lv.name)}</h3><p class="small muted">依官方梯次整卷 50 題、${S.lv==="P"?75:90} 分鐘計時，與正式考試相同。可跳題、回頭改答案，交卷後才顯示分數、錯題與解析。</p><div class="tbl" style="margin-top:12px"><table><thead><tr><th>科目</th><th>梯次</th><th class="num">最佳</th><th></th></tr></thead><tbody>`;
    for(const s of lv.subjects)for(const x of sessionsOf(s.code)){
      const best=S.mocks.filter(m=>m.sub===s.code&&m.x===x).reduce((a,m)=>Math.max(a,m.score),-1);
      h+=`<tr><td>${s.code} ${esc(s.name)}</td><td>${SESS(x)}</td><td class="num">${best<0?"—":best}</td><td><button class="btn sm" data-sub="${s.code}" data-x="${x}">開始</button></td></tr>`;}
    h+=`</tbody></table></div><p class="note" style="margin-top:8px">建議先練較早的梯次，最新一次梯次留到考前一週當實戰演練。</p></div>`;
    const mine=S.mocks.filter(m=>lv.subjects.some(s=>s.code===m.sub));
    if(mine.length)h+=`<div class="card"><h3>模擬考紀錄</h3><div class="tbl"><table><thead><tr><th>日期</th><th>科目</th><th>梯次</th><th class="num">分數</th></tr></thead><tbody>${mine.slice().reverse().slice(0,20).map(m=>`<tr><td>${m.d}</td><td>${m.sub}</td><td>${SESS(m.x)}</td><td class="num">${m.score}${m.score>=70?' <span class="tag pass">及格</span>':""}</td></tr>`).join("")}</tbody></table></div></div>`;
    $("#main").innerHTML=`<div class="view">${h}</div>`;
    document.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>startMock(b.dataset.sub,b.dataset.x));return;
  }

function curveSVG(n){
  const W=560,H=200,pl=34,pr=36,pt=12,pb=26,base=dayNum(today()),days=[];
  for(let i=n-1;i>=0;i--){const dt=new Date((base-i)*864e5);const k=dt.getUTCFullYear()+"-"+pad(dt.getUTCMonth()+1)+"-"+pad(dt.getUTCDate());days.push({k,d:S.days[k]||{a:0,c:0}});}
  const top=Math.ceil(Math.max(10,...days.map(x=>x.d.a))/10)*10,bw=(W-pl-pr)/n,ih=H-pt-pb;
  let g="";[0,.5,1].forEach(f=>{const y=pt+ih*(1-f);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${W-pr+4}" y="${y+4}">${Math.round(f*100)}%</text><text x="${pl-4}" y="${y+4}" text-anchor="end">${Math.round(top*f)}</text>`;});
  let bars="";const pts=[];
  days.forEach((x,i)=>{const h=ih*x.d.a/top,X=pl+i*bw;bars+=`<rect x="${X+1}" y="${H-pb-h}" width="${Math.max(bw-2,1)}" height="${h}" fill="var(--ai-soft)" stroke="var(--ai)" stroke-width=".5"><title>${x.k}：${x.d.a} 題</title></rect>`;if(x.d.a)pts.push([X+bw/2,pt+ih*(1-x.d.c/x.d.a),x]);});
  const line=pts.length>1?`<polyline points="${pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}" fill="none" stroke="var(--matcha)" stroke-width="2"/>`:"";
  const dots=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--matcha)"><title>${p[2].k}：正確率 ${pct(p[2].d.c/p[2].d.a)}</title></circle>`).join("");
  const lbl=[0,Math.floor(n/2),n-1].map(i=>`<text x="${pl+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${days[i].k.slice(5).replace("-","/")}</text>`).join("");
  const empty=pts.length?"":`<text x="${W/2}" y="${H/2}" text-anchor="middle">開始作答後，這裡會畫出每天的題數與正確率</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="近 ${n} 天每日作答題數與正確率">${g}${bars}${line}${dots}${lbl}${empty}</svg><div class="legend"><span><i style="background:var(--ai-soft);border:1px solid var(--ai)"></i>每日作答題數（左軸）</span><span><i style="background:var(--matcha)"></i>每日正確率（右軸）</span></div>`;
}

// Safe cloud bridge for the optional Supabase module. Preserve previous local data.
// Multi-device merge uses maxima for counters/scores (not sums) to avoid duplicating attempts.
function mergeStudyState(a,b){
  if(!b||typeof b!=="object")return Object.assign(blank(),a||{});
  const out=Object.assign(blank(),b,a);
  for(const key of ["best","read","status","feyn"]){out[key]={...(b[key]||{}),...(a[key]||{})};}
  for(const [id,val] of Object.entries(b.best||{}))out.best[id]=Math.max(Number(a.best?.[id]||0),Number(val||0));
  out.q={...(b.q||{})};
  for(const [id,val] of Object.entries(a.q||{})){const old=out.q[id];out.q[id]=old?[Math.max(old[0]||0,val[0]||0),Math.max(old[1]||0,val[1]||0),Math.max(old[2]||0,val[2]||0),(val[2]||0)>=(old[2]||0)?val[3]:old[3]]:val;}
  out.days={...(b.days||{})};for(const [d,v] of Object.entries(a.days||{})){const old=out.days[d]||{a:0,c:0};out.days[d]={a:Math.max(old.a||0,v.a||0),c:Math.max(old.c||0,v.c||0)};}
  out.drills={...(b.drills||{})};for(const [k,v] of Object.entries(a.drills||{}))if(!out.drills[k]||v.length>out.drills[k].length)out.drills[k]=v;
  out.mocks=[...(b.mocks||[])];for(const m of a.mocks||[])if(!out.mocks.some(x=>JSON.stringify(x)===JSON.stringify(m)))out.mocks.push(m);
  out.vault=[...(b.vault||[])];for(const n of a.vault||[])if(!out.vault.some(x=>x.title===n.title&&x.body===n.body&&x.date===n.date))out.vault.push(n);
  out.srs={...(b.srs||{})};for(const [id,v] of Object.entries(a.srs||{}))if(!out.srs[id]||(v.last||0)>=(out.srs[id].last||0))out.srs[id]=v;
  const localStamp=a.lastSecUpdated||0,remoteStamp=b.lastSecUpdated||0;
  if(remoteStamp>localStamp){out.lastSec=b.lastSec;out.lastSecUpdated=remoteStamp;}
  out.attachments=a.attachments||b.attachments||[]; // Remote snapshots exclude binary attachments; retain account-local metadata.
  return out;
}

    const userKey=KEY+"-account-"+uid;
    const claimKey=KEY+"-anonymous-claimed-by";
    let cached=null,anonymous=null,claim=null;
    try{const raw=localStorage.getItem(userKey);if(raw)cached=JSON.parse(raw);
      const localRaw=localStorage.getItem(KEY);if(localRaw)anonymous=JSON.parse(localRaw);
      claim=localStorage.getItem(claimKey);
    }catch(e){}
    // Migrate anonymous history at most once, only to the first signed-in identity.
    const permittedAnonymous=!claim||claim===uid;
    const starting=mergeStudyState(cached||{},remote||{});
    S=permittedAnonymous?mergeStudyState(anonymous||{},starting):mergeStudyState({},starting);
    if(!claim&&anonymous){try{localStorage.setItem(claimKey,uid);}catch(e){}}
    activeSaveKey=userKey;authenticated=true;save();render();
  },
  signOut:()=>{
    // Keep the anonymous progress intact for this device; never erase prior work.
    activeSaveKey=KEY;
    authenticated=false;S=blank();V={view:"home",sec:null,subj:null};clearInterval(mockTimer);quiz=drill=mock=diag=null;render();
  },
  updateCloudName:(name)=>{S.localName=String(name||"").slice(0,35);save();render();}
};

// ---- boot ----
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{S.lv=b.dataset.lv;save();drill=null;quiz=null;V.subj=null;if(V.view==="unit"||V.view==="diag")V.view="units";render();});
document.getElementById("studySearch").addEventListener("keydown",e=>{if(e.key!=="Enter")return;const term=e.target.value.trim().toLocaleLowerCase("zh-Hant");if(!term||!COURSE)return;const matches=ORDER.filter(code=>{const x=SECS[code];return x.lv===S.lv&&(code.toLowerCase().includes(term)||x.sec.name.toLocaleLowerCase("zh-Hant").includes(term)||x.ch.name.toLocaleLowerCase("zh-Hant").includes(term));});if(matches.length)openUnit(matches[0]);else{ayiaState("thinking");document.getElementById("ayiaText").textContent="目前找不到符合的單元。試試更短的詞，或從左側目次選擇。";}});
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{if(b.dataset.v==="drill")drill=null;go(b.dataset.v);});
$("#tocBtn").onclick=()=>{if(window.matchMedia("(min-width:901px)").matches){S.toc=!S.toc;save();render();}else{$("#toc").classList.add("open");$("#drawerBg").classList.add("open");}};
$("#drawerBg").onclick=closeDrawer;
window.matchMedia("(min-width:901px)").addEventListener("change",()=>{closeDrawer();render();});
Promise.all([fetch("course.json").then(r=>r.json()),fetch("bank.json").then(r=>r.json()),fetch("study-content.json").then(r=>{if(!r.ok)throw new Error("study content");return r.json();}).catch(()=>null)]).then(([c,b,study])=>{
  window.IPAS_STUDY?.setData(study);
  COURSE=c;BANK=b;
  for(const lv of COURSE.levels)for(const s of lv.subjects)for(const ch of s.chapters)for(const sec of ch.sections){SECS[sec.code]={sec,ch,subj:s,lv:lv.id};ORDER.push(sec.code);}
  ayiaState("welcome");
  render();
}).catch(()=>{$("#main").innerHTML=`<div class="card">題庫載入失敗，請重新整理頁面。</div>`;});
})();
</script>
<script type="module" src="cloud.js"></script>
</body>
</html>
